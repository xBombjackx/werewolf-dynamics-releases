<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Werewolf Dynamics — WD 361, Live</title>
</head>
<body>
<script type="module">
import { mountLiveDemo } from './wd-live-page.js';

const P = { power: 0, type: 1, mode: 2, bands: 3, drive: 4, tilt: 5, amount: 6, mix: 7, output: 8, ag: 9, denorm: 10 };
mountLiveDemo({
  page: '361.html',
  title: 'WD 361',
  wasm: 'wd-361.wasm',
  defaultStem: 1,
  blurb: 'Four-band analog compander compiled to WebAssembly. Encode alone to lift quiet treble detail and airy room ambiance, switch between Type A, Broadband, and Treble Type B networks, or run complementary Encode + Decode.',
  defaults: { [P.power]: 1, [P.type]: 0, [P.mode]: 0, [P.bands]: 0, [P.drive]: 3, [P.tilt]: 0, [P.amount]: 100, [P.mix]: 60, [P.output]: 0, [P.ag]: 1, [P.denorm]: 1 },
  modes: { param: P.type, labels: ['Type A (4-Band)', 'Broadband', 'Type B (Air)'] },
  knobs: [
    { id: P.drive,  name: 'Drive',  min: -12, max: 24,  def: 3,   fmt: v => (v >= 0 ? '+' : '') + v.toFixed(1) + ' dB' },
    { id: P.tilt,   name: 'Tilt',   min: -6,  max: 6,   def: 0,   fmt: v => (v >= 0 ? '+' : '') + v.toFixed(1) + ' dB' },
    { id: P.amount, name: 'Amount', min: 0,   max: 100, def: 100, fmt: v => v.toFixed(0) + ' %' },
    { id: P.mix,    name: 'Mix',    min: 0,   max: 100, def: 60,  fmt: v => v.toFixed(0) + ' %' },
    { id: P.output, name: 'Output', min: -12, max: 12,  def: 0,   fmt: v => (v >= 0 ? '+' : '') + v.toFixed(1) + ' dB' },
  ],
  switches: [
    { param: P.mode, values: [0, 1, 2], labels: ['MODE: ENCODE', 'MODE: DECODE', 'MODE: BOTH'] },
    { param: P.bands, values: [0, 1, 2], labels: ['BANDS: ALL', 'BANDS: LOW', 'BANDS: HIGH'] },
    { param: P.ag, labels: ['MATCH: OFF', 'MATCH: ON'] },
    { param: P.power, label: 'POWER', power: true },
  ],
  presets: [
    { label: 'Vocal Air Trick', vals: { [P.type]: 0, [P.mode]: 0, [P.bands]: 2, [P.drive]: 4, [P.tilt]: 2.0, [P.mix]: 50 } },
    { label: '4-Band Lift', vals: { [P.type]: 0, [P.mode]: 0, [P.bands]: 0, [P.drive]: 6, [P.mix]: 80 } },
    { label: 'Broadband Glue', vals: { [P.type]: 1, [P.mode]: 0, [P.drive]: 3, [P.mix]: 65 } },
  ],
  meter: {
    ticks: ['ACTION -12', '-6', '0', '+6', '+12 dB'],
    init: 'Action +0.0 dB · AG +0.0 dB',
    pct: m => Math.min(100, Math.abs(m.gr) / 12 * 100),
    text: m => `Action ${m.gr >= 0 ? '+' : ''}${m.gr.toFixed(1)} dB · AG ${m.ag >= 0 ? '+' : ''}${m.ag.toFixed(1)} dB`,
  },
});
</script>
</body>
</html>
