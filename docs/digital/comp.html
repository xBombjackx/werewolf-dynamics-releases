  function renderSelfTrackChip() {
    const chip = $('selfTrackChip');
    const nameEl = $('selfTrackName');
    if (nameEl && nameEl.isConnected && !nameEl.querySelector('input'))
      nameEl.textContent = selfMeta.name || 'Comp 1';
    if (chip) {
      const pubName = selfMeta.publishedName || selfMeta.name || 'Comp 1';
      chip.title = 'Click to rename this Compressor track · Broadcasting on Beacon as "' + pubName + '"';
    }
  }

  function startInlineTrackRename(labelEl, currentText) {
    if (!labelEl || labelEl.querySelector('input')) return;
    const prev = currentText;
    const input = document.createElement('input');
    input.type = 'text';
    input.maxLength = 47;
    input.className = 'track-name-input';
    input.value = prev;
    let done = false;
    const commit = async keep => {
      if (done) return;
      done = true;
      const next = keep ? input.value.trim() : prev;
      input.replaceWith(labelEl);
      if (keep && host) {
        try {
          const res = await host.call('setInstanceName', next);
          if (res && res.ok) {
            selfMeta.name = res.name || selfMeta.name;
            selfMeta.customName = res.customName || '';
            if (typeof res.beaconPublishedName === 'string') selfMeta.publishedName = res.beaconPublishedName;
            if (typeof res.beaconPublishing === 'boolean') selfMeta.publishing = res.beaconPublishing;
            renderSelfTrackChip();
            await refreshBeaconSources();
          }
        } catch (e) {}
      }
    };
    input.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') { ev.preventDefault(); commit(true); }
      else if (ev.key === 'Escape') { ev.preventDefault(); commit(false); }
      ev.stopPropagation();
    });
    input.addEventListener('pointerdown', ev => ev.stopPropagation());
    input.addEventListener('blur', () => commit(true));
    labelEl.replaceWith(input);
    input.focus({ preventScroll: true });
    input.select();
  }

  {
    const chip = $('selfTrackChip');
    if (chip) {
      chip.addEventListener('click', () => startInlineTrackRename($('selfTrackName'), selfMeta.customName || selfMeta.name));
    }
  }

  function setScSourceIndex(idx) {
    setComboIndex('scsource', idx);
    scSourceIdx = idx;
    document.querySelectorAll('#scsource-group button').forEach(btn => {
      btn.classList.toggle('on', parseInt(btn.dataset.index, 10) === idx);
    });
    syncAutoGainUi();
    updateSidechainUi();
    updateBeaconLed();
    drawCurve();
    drawScroll();
  }

  function updateSidechainUi() {
    const h = $('scHint');
    if (h) {
      if (scSourceIdx === 1) {
        h.classList.remove('sc-ready');
        h.textContent = beaconSelected ? ('Ext · ' + beaconSelected) : (scActive ? 'Ext · Host Bus' : 'External');
        h.title = '';
      } else if (scActive || beaconSelected) {
        h.classList.add('sc-ready');
        h.textContent = beaconSelected ? 'Beacon ready · Use External' : 'Host SC ready · Use External';
        h.title = 'Click to switch Sidechain Source to External';
      } else {
        h.classList.remove('sc-ready');
        h.textContent = 'Internal';
        h.title = '';
      }
    }
    const hh = $('historyHint');
    if (hh) {
      if (historyBuf && historyBuf.isFrozen()) {
        hh.textContent = 'Frozen · Scrubbing';
        hh.classList.remove('key-active');
      } else if (scSourceIdx === 1) {
        const srcName = beaconSelected ? beaconSelected : (scActive ? 'Host Bus' : 'External');
        const dbStr = (Number.isFinite(liveScPeakDb) && liveScPeakDb > -119.5) ? liveScPeakDb.toFixed(1) + ' dB' : '—';
        hh.textContent = 'Key: ' + srcName + ' · ' + dbStr;
        hh.classList.add('key-active');
      } else {
        hh.textContent = 'Last 10 seconds';
        hh.classList.remove('key-active');
      }
    }
  }

  function updateBeaconLed() {
    const wrap = $('beaconPickerWrap');
    if (!wrap) return;
    wrap.classList.remove('receiving', 'waiting', 'mismatch');
    const baseTip = 'Select an active Werewolf Digital Beacon track for external compressor sidechain keying. Wireless cross-track key — for sample-exact timing at large DAW buffer sizes (1024+), use Off (Host Bus) with a DAW sidechain send.';
    if (beaconSelected && beaconSrMismatch) {
      wrap.classList.add('mismatch');
      wrap.title = `Sample rate mismatch between this track and WD Beacon "${beaconSelected}" — sidechain input is muted.`;
    } else if (beaconSelected && scSourceIdx !== 1) {
      wrap.classList.add('waiting');
      wrap.title = `Beacon "${beaconSelected}" is selected, but Sidechain is Internal — switch Sidechain to External so Beacon keys compression.`;
    } else if (beaconSelected && scSourceIdx === 1) {
      wrap.classList.add(beaconReceiving ? 'receiving' : 'waiting');
      wrap.title = (beaconReceiving
        ? `Receiving external sidechain audio from WD Beacon "${beaconSelected}". `
        : `Waiting for audio from WD Beacon "${beaconSelected}". `) + baseTip;
    } else if (!beaconSelected && scSourceIdx === 1) {
      wrap.classList.add(scActive ? 'receiving' : 'waiting');
      wrap.title = scActive
        ? 'Receiving external sidechain audio from Host Bus 1. ' + baseTip
        : 'External sidechain is active — waiting for audio on Host Bus 1 or select a WD Beacon source.';
    } else if (!beaconSelected && scSourceIdx === 0 && scActive) {
      wrap.classList.add('waiting');
      wrap.title = 'Host Bus 1 sidechain signal detected while Sidechain is Internal — switch to External to key from Host Bus 1.';
    } else {
      wrap.title = baseTip;
    }
  }

  function renderBeaconSources(res) {
    const sel = $('beaconSourceSelect');
    if (!sel || !res || typeof res !== 'object') return;
    const sources = Array.isArray(res.sources) ? res.sources : [];
    if (typeof res.selected === 'string') beaconSelected = res.selected;
    if (!beaconMetersSeen && typeof res.receiving === 'boolean') beaconReceiving = res.receiving;
    if (typeof res.srMismatch === 'boolean') beaconSrMismatch = res.srMismatch;

    const sig = sources.map(s => `${s.name}:${s.sr}:${s.ch}`).join('|') + '#' + beaconSelected;
    updateBeaconLed();
    if (document.activeElement === sel || sig === lastBeaconSig) return;
    lastBeaconSig = sig;

    sel.textContent = '';
    const off = document.createElement('option');
    off.value = '';
    off.textContent = 'Off (Host Bus)';
    sel.appendChild(off);

    let found = (beaconSelected === '');
    for (const s of sources) {
      const opt = document.createElement('option');
      opt.value = s.name;
      const sr = s.sr ? (s.sr / 1000).toFixed(s.sr % 1000 === 0 ? 0 : 1) + 'k' : '?';
      const ch = s.ch === 1 ? 'Mono' : s.ch === 2 ? 'St' : (s.ch + 'ch');
      opt.textContent = `${s.name} (${sr} · ${ch})`;
      if (s.name === beaconSelected) found = true;
      sel.appendChild(opt);
    }
    if (!found && beaconSelected) {
      const offline = document.createElement('option');
      offline.value = beaconSelected;
      offline.textContent = `${beaconSelected} (waiting…)`;
      sel.appendChild(offline);
    }
    sel.value = beaconSelected;
  }

  async function refreshBeaconSources() {
    if (!host) return;
    try {
      const res = await host.call('getBeaconSources');
      renderBeaconSources(res);
    } catch (e) {}
  }

  {
    const sel = $('beaconSourceSelect');
    if (sel) {
      sel.addEventListener('pointerdown', refreshBeaconSources);
      sel.addEventListener('focus', refreshBeaconSources);
      sel.addEventListener('change', async () => {
        beaconSelected = sel.value || '';
        beaconSrMismatch = false;
        if (beaconSelected) {
          setScSourceIndex(1);
        } else {
          updateSidechainUi();
          updateBeaconLed();
          drawCurve();
          drawScroll();
        }
        if (host) {
          try {
            const res = await host.call('setBeaconSource', beaconSelected);
            if (res && typeof res.receiving === 'boolean') beaconReceiving = res.receiving;
            if (res && typeof res.srMismatch === 'boolean') beaconSrMismatch = res.srMismatch;
            if (res && typeof res.scActive === 'boolean') scActive = res.scActive;
            updateSidechainUi();
            updateBeaconLed();
          } catch (e) {}
        }
      });
    }
  }

  const beaconEpochWatch = (window.WDKit && WDKit.createBeaconEpochWatcher)
    ? WDKit.createBeaconEpochWatcher(refreshBeaconSources)
    : null;

  function updateMeters(meters) {
    beaconMetersSeen = true;
    if (beaconEpochWatch) beaconEpochWatch(meters);
    if (typeof meters.beaconReceiving === 'boolean') beaconReceiving = meters.beaconReceiving;
    if (typeof meters.beaconSrMismatch === 'boolean') beaconSrMismatch = meters.beaconSrMismatch;
    if (typeof meters.scActive === 'boolean') scActive = meters.scActive;
    if (typeof meters.beaconSource === 'string' && !beaconSelected) beaconSelected = meters.beaconSource;
    if (typeof meters.selfName === 'string' && meters.selfName) selfMeta.name = meters.selfName;
    if (typeof meters.selfCustomName === 'string') selfMeta.customName = meters.selfCustomName;
    if (typeof meters.beaconPublishedName === 'string') selfMeta.publishedName = meters.beaconPublishedName;
    if (typeof meters.beaconPublishing === 'boolean') selfMeta.publishing = meters.beaconPublishing;
    renderSelfTrackChip();
    const targetSc = (typeof meters.sc === 'number' && Number.isFinite(meters.sc)) ? meters.sc : -120;
    if (meters.activeSlot !== undefined) {
      currentActiveSlot = meters.activeSlot;
      if (presetKit) presetKit.setActiveSlotExternal(meters.activeSlot);
      else {
        const btnA = $('btn_slotA');
        const btnB = $('btn_slotB');
        if (btnA) btnA.classList.toggle('on', meters.activeSlot === 0);
        if (btnB) btnB.classList.toggle('on', meters.activeSlot === 1);
      }
    }

    if (historyBuf && historyBuf.isFrozen()) {
      updateBeaconLed();
      return;
    }

    liveScPeakDb = targetSc;
    updateSidechainUi();
    updateBeaconLed();
    const targetGr = Math.abs(Number.isFinite(meters.gr) ? meters.gr : 0);
    const targetIn = Number.isFinite(meters.in) ? meters.in : -70;
    const targetOut = Number.isFinite(meters.out) ? meters.out : -70;

    mGr += (targetGr - mGr) * 0.8;
    mIn += (targetIn - mIn) * (targetIn > mIn ? 0.8 : 0.15);
    mOut += (targetOut - mOut) * (targetOut > mOut ? 0.8 : 0.15);

    const grText = mGr < 0.05 ? '0.0' : '-' + mGr.toFixed(1);
    $('grVal').textContent = grText;
    $('grMeterVal').textContent = grText + ' dB';
    $('inVal').textContent = mIn <= -69.5 ? '-inf' : mIn.toFixed(1) + ' dB';
    $('outVal').textContent = mOut <= -69.5 ? '-inf' : mOut.toFixed(1) + ' dB';

    const dbToPct = db => clamp((db + 60) / 60, 0, 1) * 100;
    const grToPct = db => clamp(db / 30.0, 0, 1) * 100;
    $('grBar').style.setProperty('--fill', grToPct(mGr).toFixed(1) + '%');
    $('inBar').style.setProperty('--fill', dbToPct(mIn).toFixed(1) + '%');
    $('outBar').style.setProperty('--fill', dbToPct(mOut).toFixed(1) + '%');

    if (typeof meters.autoGainDb === 'number' && Number.isFinite(meters.autoGainDb)) {
      liveAutoGainDb = meters.autoGainDb;
      syncAutoGainUi();
    }
    updateAutoReadout('param_threshold', 'threshold', Number.isFinite(meters.autoThreshOffsetDb) ? meters.autoThreshOffsetDb : 0, fmt1);

    liveDetectorDb = Number.isFinite(meters.detector) ? meters.detector : -70;
    liveGrDb = Number.isFinite(meters.gr) ? meters.gr : 0;

    const grVals = Array.isArray(meters.grHistory) ? meters.grHistory : [];
    if (grVals.length > 0) {
      for (const rawGr of grVals) {
        const gr = Number.isFinite(rawGr) ? rawGr : 0;
        pushHistoryPoint(gr, targetIn, targetOut, targetSc, liveDetectorDb);
      }
    } else {
      pushHistoryPoint(-targetGr, targetIn, targetOut, targetSc, liveDetectorDb);
    }
    syncHoldAvailability();
    if (scrubTimeline) scrubTimeline.update();

    drawCurve();
    drawScroll();
    drawScEq();
  }

  setTimeout(async () => {
    initAll();
    fitCanvases();

    if (host) {
      try {
        const state = await host.call('getUiState');
        if (state) {
          if (state.build) $('buildTag').textContent = state.build;
          if (state.sampleRate) {
            sampleRate = state.sampleRate;
            $('srTag').textContent = (sampleRate / 1000).toFixed(1) + ' kHz';
          }
          if (window.WDKit && WDKit.bindBrandDiagnostics) {
            WDKit.bindBrandDiagnostics(document.querySelector('.brand'), {
              plugin: 'Werewolf Digital Compressor',
              sampleRate: state.sampleRate ? (state.sampleRate / 1000).toFixed(1) + ' kHz' : '—',
              build: state.build || '—'
            });
          }
          if (state.selfName) selfMeta.name = state.selfName;
          if (typeof state.selfCustomName === 'string') selfMeta.customName = state.selfCustomName;
          if (typeof state.beaconPublishedName === 'string') selfMeta.publishedName = state.beaconPublishedName;
          if (typeof state.beaconPublishing === 'boolean') selfMeta.publishing = state.beaconPublishing;
          if (typeof state.beaconSource === 'string') beaconSelected = state.beaconSource;
          if (typeof state.beaconReceiving === 'boolean') beaconReceiving = state.beaconReceiving;
          if (typeof state.beaconSrMismatch === 'boolean') beaconSrMismatch = state.beaconSrMismatch;
          if (typeof state.scActive === 'boolean') scActive = state.scActive;
          if (typeof state.sc === 'number' && Number.isFinite(state.sc)) liveScPeakDb = state.sc;
          renderSelfTrackChip();
          updateSidechainUi();
          updateBeaconLed();
        }
      } catch (e) { console.warn('getUiState call failed', e); }

      await refreshBeaconSources();

      try {
        await host.call('requestStaticCurve');
      } catch (e) { console.warn('requestStaticCurve call failed', e); }
    } else {
      renderSelfTrackChip();
      updateSidechainUi();
      updateBeaconLed();
    }
  }, 120);

  if (host) {
    host.on('meters', data => updateMeters(data));
    host.on('staticCurve', data => {
      staticCurveData = data;
      drawCurve();
    });
  } else {
    const btnA = $('btn_slotA');
    if (btnA) btnA.classList.add('on');
    $('buildTag').textContent = '0.0.0 · built 2026-08-29 15:00';
    $('srTag').textContent = '48.0 kHz';
    setInterval(() => {
      const t = Date.now() * 0.001;
      updateMeters({
        gr: -4.0 - 3.0 * Math.sin(t * 2),
        in: -10.0 + 15.0 * Math.sin(t * 3),
        out: -14.0 + 8.0 * Math.sin(t * 3),
        detector: -10.0 + 15.0 * Math.sin(t * 3),
        autoGainDb: 4.2,
        activeSlot: 0
      });
    }, 33);

    staticCurveData = {
      inVals: Array.from({ length: 101 }, (_, i) => -80 + i),
      outVals: Array.from({ length: 101 }, (_, i) => {
        const db = -80 + i;
        const raw = db < -20 ? db : -20 + (db + 20) / 4;
        return raw + 4.2;
      })
    };
    lawThreshold = -20; lawRatio = 4; updateLawHint();
    drawCurve();
  }

})();
</script>
</body>
</html>
