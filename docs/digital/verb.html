      tCtx.strokeStyle = active ? COL.accentLit : ink(0.28);
      tCtx.lineWidth = active ? 1.5 : 1.0;
      tCtx.setLineDash([3, 3]);
      tCtx.beginPath();
      tCtx.moveTo(x, top);
      tCtx.lineTo(x, bot);
      tCtx.stroke();
      tCtx.setLineDash([]);
    };
    drawGuide(g.xPreRaw, tailDragHandle === 'predelay' || tailHoverHandle === 'predelay');
    if (!frozen)
      drawGuide(g.xDecRaw, tailDragHandle === 'decay' || tailHoverHandle === 'decay');
    tCtx.restore();

    // 7. On-Canvas Draggable Handle Pills (`Pre-Delay` and `Decay`)
    const drawHandlePill = (hx, hy, anchorX, textStr, active) => {
      tCtx.font = '700 9.5px ' + cssVar('--font');
      const pw = tCtx.measureText(textStr).width + 14;
      const ph = 18;
      if (Math.abs(hx - anchorX) > pw * 0.45) {
        tCtx.strokeStyle = active ? COL.accentLit : ink(0.38);
        tCtx.lineWidth = 1;
        tCtx.beginPath();
        tCtx.moveTo(hx, hy);
        tCtx.lineTo(anchorX, hy);
        tCtx.stroke();
      }
      tCtx.fillStyle = active ? COL.accentLit : COL.cream;
      tCtx.beginPath();
      if (tCtx.roundRect) tCtx.roundRect(hx - pw / 2, hy - ph / 2, pw, ph, 9);
      else tCtx.rect(hx - pw / 2, hy - ph / 2, pw, ph);
      tCtx.fill();

      tCtx.fillStyle = COL.well;
      tCtx.textAlign = 'center';
      tCtx.textBaseline = 'middle';
      tCtx.fillText(textStr, hx, hy + 0.5);
      tCtx.textBaseline = 'alphabetic';
    };

    if (!frozen) {
      drawHandlePill(g.hxDec, g.hyDec, g.xDecRaw, g.decLabel,
        tailDragHandle === 'decay' || tailHoverHandle === 'decay');
    }
    drawHandlePill(g.hxPre, g.hyPre, g.xPreRaw, g.preLabel,
      tailDragHandle === 'predelay' || tailHoverHandle === 'predelay');

    // 8. Top strip micro-legend (Dry · Wet · Duck) + ellipsis-truncated External Key badge
    const narrowLegend = tW < 252 && duckSourceIdx === 1;
    const chipGap = narrowLegend ? 5 : 9;
    tCtx.font = '700 8.5px ' + cssVar('--font');
    tCtx.textAlign = 'left';
    tCtx.textBaseline = 'middle';
    let lx = 6;
    const ly = 11;
    const drawLegendChip = (dotCol, labelText) => {
      tCtx.fillStyle = dotCol;
      tCtx.beginPath();
      tCtx.arc(lx + 3, ly, 2.8, 0, Math.PI * 2);
      tCtx.fill();
      tCtx.fillStyle = ink(0.58);
      tCtx.fillText(labelText, lx + 7.5, ly + 0.5);
      lx += 7.5 + tCtx.measureText(labelText).width + chipGap;
    };
    drawLegendChip(ink(0.62), 'DRY');
    drawLegendChip(COL.accentLit, 'WET');
    const duckChipText = liveDuckDb <= -0.05
      ? (narrowLegend ? (liveDuckDb.toFixed(1) + 'dB') : ('DUCK ' + liveDuckDb.toFixed(1) + 'dB'))
      : 'DUCK';
    drawLegendChip(duckSourceIdx === 1 ? '#38bdf8' : '#f59e0b', duckChipText);

    if (duckSourceIdx === 1) {
      const hasKeySignal = beaconSelected ? beaconReceiving : scActive;
      const rawKeyLabel = beaconSelected ? ('KEY · ' + beaconSelected) : 'KEY';
      tCtx.font = '700 8.5px ' + cssVar('--font');
      const availW = xNow - lx - 2;
      if (availW >= 32) {
        const fittedText = truncateTextWithEllipsis(tCtx, rawKeyLabel, availW - 10) || 'KEY';
        const pw = Math.min(availW, tCtx.measureText(fittedText).width + 10);
        const px = xNow - pw;
        const py = 3;
        tCtx.fillStyle = hasKeySignal ? 'rgba(56, 189, 248, 0.18)' : 'rgba(56, 189, 248, 0.08)';
        tCtx.strokeStyle = hasKeySignal ? 'rgba(56, 189, 248, 0.62)' : 'rgba(56, 189, 248, 0.28)';
        tCtx.lineWidth = 1;
        tCtx.beginPath();
        if (tCtx.roundRect) tCtx.roundRect(px, py, pw, 16, 8);
        else tCtx.rect(px, py, pw, 16);
        tCtx.fill();
        tCtx.stroke();
        tCtx.fillStyle = hasKeySignal ? '#38bdf8' : 'rgba(56, 189, 248, 0.72)';
        tCtx.textAlign = 'center';
        tCtx.fillText(fittedText, px + pw * 0.5, py + 8.5);
      }
    }
    tCtx.textBaseline = 'alphabetic';
  }

  // Continuous C^1-smooth mapping for #tailCanvas Decay handle drag:
  // tracks cursor 1:1 linearly across the visible span, and splices with matched
  // value AND derivative into exponential scaling outside [uNeg, uPos] so dragging
  // 0.1 s <-> 120 s is strictly monotonic with zero step discontinuities.
  function computeSmoothDraggedDecay(d0, span, u) {
    const uPos = 0.50;
    const uNeg = -Math.min(0.65, (0.5 * d0) / Math.max(0.1, span));
    if (u >= uNeg && u <= uPos)
      return d0 + u * span;
    if (u > uPos) {
      const yPos = d0 + uPos * span;
      const du = u - uPos;
      return yPos * Math.exp((span / yPos) * du + 5.2 * du * du);
    }
    const yNeg = Math.max(0.05, d0 + uNeg * span);
    const du = u - uNeg; // negative
    return yNeg * Math.exp((span / yNeg) * du - 2.2 * du * du);
  }

  tailCanvas.addEventListener('pointerdown', ev => {
    if ((ev.button ?? 0) !== 0 || tW < 40 || tH < 60) return;
    const r = tailCanvas.getBoundingClientRect();
    const mx = ev.clientX - r.left, my = ev.clientY - r.top;
    const hit = hitTestTailHandle(mx, my);
    if (!hit) return;

    tailDragHandle = hit;
    tailDragStart = {
      x: ev.clientX,
      preMs: predelayMs,
      decaySec: globalDecay,
      span: tailSpanSeconds()
    };
    const s = sl(hit);
    if (s) s.sliderDragStarted();
    selectPage('space');
    tailCanvas.setPointerCapture(ev.pointerId);
    tailCanvas.style.cursor = 'ew-resize';
    ev.preventDefault();
    drawTail();
  });

  tailCanvas.addEventListener('pointermove', ev => {
    if (tW < 40 || tH < 60) return;
    const r = tailCanvas.getBoundingClientRect();
    const mx = ev.clientX - r.left, my = ev.clientY - r.top;
    if (!tailDragHandle || !tailDragStart) {
      const near = hitTestTailHandle(mx, my);
      if (near !== tailHoverHandle) {
        tailHoverHandle = near;
        tailCanvas.style.cursor = near ? 'ew-resize' : 'default';
        drawTail();
      }
      return;
    }

    // `NOW` sits on the right edge: dragging left (away from NOW) lengthens time.
    const fine = ev.shiftKey ? 0.1 : 1.0;
    const dxLeft = (tailDragStart.x - ev.clientX) * fine;
    const plotW = Math.max(32, tW - RIGHT_PAD - 4);
    if (tailDragHandle === 'predelay') {
      const msPerPx = Math.min((tailDragStart.span * 1000.0) / plotW, 1.25);
      const nextPre = clamp(tailDragStart.preMs + dxLeft * msPerPx, 0.0, 200.0);
      setParamScaled('predelay', nextPre);
    } else if (tailDragHandle === 'decay') {
      const nextDec = clamp(
        computeSmoothDraggedDecay(tailDragStart.decaySec, tailDragStart.span, dxLeft / plotW),
        0.1, 120.0);
      setParamScaled('decay', nextDec);
    }
    updateTailHint();
    updateDecayHint();
    drawTail();
  });

  const stopTailDrag = ev => {
    if (!tailDragHandle) return;
    const s = sl(tailDragHandle);
    if (s) s.sliderDragEnded();
    tailDragHandle = null;
    tailDragStart = null;
    if (ev && ev.pointerId !== undefined) {
      try { tailCanvas.releasePointerCapture(ev.pointerId); } catch (_) {}
    }
    drawTail();
  };
  tailCanvas.addEventListener('pointerup', stopTailDrag);
  tailCanvas.addEventListener('pointercancel', stopTailDrag);
  window.addEventListener('blur', stopTailDrag);
  tailCanvas.addEventListener('pointerleave', () => {
    if (!tailDragHandle && tailHoverHandle !== null) {
      tailHoverHandle = null;
      tailCanvas.style.cursor = 'default';
      drawTail();
    }
  });
  tailCanvas.addEventListener('dblclick', ev => {
    if (tW < 40 || tH < 60) return;
    const r = tailCanvas.getBoundingClientRect();
    const hit = hitTestTailHandle(ev.clientX - r.left, ev.clientY - r.top);
    if (!hit) return;
    resetParamDefault(hit);
    drawTail();
  });

  drawDecayFn = drawDecay;
  drawTailFn = drawTail;

  function updateTailHint() {
    $('tailHint').textContent = frozen ? 'Frozen'
      : (predelayMs >= 1 ? fmtMsShort(predelayMs) + ' + ' : '') + fmtSec(globalDecay);
  }

  // --------------------------------------------------------------- pages
  let currentPage = 'space';
  let currentEqBand = 1;
  const EQ_BAND_NAMES = ['Low shelf', 'Bell', 'Bell', 'High shelf'];
  function selectPage(p) {
    currentPage = p;
    document.querySelectorAll('#page-selector button').forEach(b => b.classList.toggle('on', b.dataset.page === p));
    $('pane_space').classList.toggle('active', p === 'space');
    $('pane_tone').classList.toggle('active', p === 'tone');
    $('pane_blend').classList.toggle('active', p === 'blend');
    $('pane_ratios').classList.toggle('active', p === 'decay' && !decayEqOn);
    $('pane_eq').classList.toggle('active', p === 'decay' && decayEqOn);
    for (let b = 1; b <= 4; ++b) $('eqrow_' + b).classList.toggle('active', b === currentEqBand);
    document.querySelectorAll('#eq-band-selector button').forEach(b => b.classList.toggle('on', parseInt(b.dataset.band, 10) === currentEqBand));
    const t = $('page_title');
    if (p === 'space') t.textContent = MODE_CHOICES[comboIndex('mode', MODE_CHOICES.length)] || 'Hall';
    else if (p === 'tone') t.textContent = 'Damping & diffusion';
    else if (p === 'blend') t.textContent = 'Reflections & width';
    else t.textContent = decayEqOn ? ('Band ' + currentEqBand + ' · ' + EQ_BAND_NAMES[currentEqBand - 1]) : 'Passive ratios';
  }
  function selectEqBand(b) {
    currentEqBand = b;
    selectPage(currentPage);
    drawDecay();
  }
  document.querySelectorAll('#page-selector button').forEach(b => {
    b.addEventListener('click', () => selectPage(b.dataset.page));

  // ----------------------------------------------------------- formatting
  const fmtMsShort = v => v < 10.0 ? v.toFixed(1) + ' ms' : Math.round(v) + ' ms';
  const fmtPct = v => Math.round(v) + '%';
  const fmtHz = v => v >= 1000 ? (v / 1000).toFixed(2) + ' kHz' : Math.round(v) + ' Hz';

  // ------------------------------------------------------------------- init
  function initAll() {
    document.querySelectorAll('.knob').forEach(mountKnob);

    // Space
    bindSlider($('param_decay'), 'decay', fmtSec, v => { globalDecay = v; updateTailHint(); drawTail(); updateDecayHint(); });

    {

        updateBeaconLed();

      };
      if (typeof updateDuckPills === 'function' && host) updateDuckPills();
    }

    // Master
    bindSlider($('param_mix'), 'mix', fmtPct);
    bindToggle($('param_freeze'), 'freeze', v => {
      if (v && tailDragHandle === 'decay') stopTailDrag();
      frozen = v;
      updateTailHint();
      drawTail();
    });
    bindToggle($('param_delta'), 'delta');
    bindToggle($('param_power'), 'power', v => {
      const b = $('param_power');
      if (b) b.lastChild.textContent = v ? 'Engaged' : 'Bypassed';
    });
    bindToggle($('param_decayEqEnable'), 'decayEqEnable', v => {
      decayEqOn = v;
      updateDecayTitle();
      selectPage(currentPage);
      drawDecay();
    });

    if (window.WDKit && WDKit.enhanceAllKnobs) WDKit.enhanceAllKnobs(sl);
    selectPage('space');
    updateDecayTitle();
    updateTailHint();
    updateDuckState();
  }

  function renderSelfTrackChip() {
    const chip = $('selfTrackChip');
    const lbl = $('selfTrackName');
    if (!chip || !lbl || selfEditing) return;
    lbl.textContent = selfMeta.name || 'Verb 1';
    const pub = selfMeta.publishing && selfMeta.publishedName
      ? ' · broadcasting on WD Beacon as "' + selfMeta.publishedName + '"'
      : '';
    chip.title = 'Instance name' + pub + ' — click to rename';
  }

  function startSelfRename() {
    const chip = $('selfTrackChip');
    const lbl = $('selfTrackName');
    if (!chip || !lbl || selfEditing) return;
    selfEditing = true;
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'track-name-input';
    input.maxLength = 47;
    input.value = selfMeta.customName || selfMeta.name || '';
    lbl.style.display = 'none';
    chip.insertBefore(input, lbl);
    input.focus();
    input.select();

    let finished = false;
    const finish = async (save) => {
      if (finished) return;
      finished = true;
      const next = save ? input.value.trim() : null;
      if (input.parentNode) input.parentNode.removeChild(input);
      lbl.style.display = '';
      selfEditing = false;
      if (save) {
        selfMeta.customName = next;
        if (next) selfMeta.name = next;
        if (host) {
          try {
            const res = await host.call('setInstanceName', next);
            if (res && typeof res.name === 'string') selfMeta.name = res.name;
            if (res && typeof res.customName === 'string') selfMeta.customName = res.customName;
            if (res && typeof res.beaconPublishedName === 'string') selfMeta.publishedName = res.beaconPublishedName;
            if (res && typeof res.beaconPublishing === 'boolean') selfMeta.publishing = res.beaconPublishing;
          } catch (e) {}
        }
      }
      renderSelfTrackChip();
    };
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
      e.stopPropagation();
    });
    input.addEventListener('blur', () => finish(true));
  }

  {
    const chip = $('selfTrackChip');
    if (chip) chip.addEventListener('click', startSelfRename);
  }

  function updateDuckKeyHint() {
    const hint = $('duckKeyHint');
    if (!hint) return;
    hint.classList.remove('warn');
    if (duckSourceIdx !== 1) {
      hint.hidden = true;
    } else if (beaconSelected && beaconSrMismatch) {
      hint.textContent = 'Beacon SR mismatch';
      hint.classList.add('warn');
      hint.hidden = false;
    } else if (beaconSelected && !beaconReceiving) {
      hint.textContent = 'Waiting for Beacon';
      hint.hidden = false;
    } else if (!beaconSelected && !scActive) {
      hint.textContent = 'No key connected';
      hint.hidden = false;
    } else {
      hint.hidden = true;
    }
  }

  function updateBeaconLed() {
    const wrap = $('beaconPickerWrap');
    if (wrap) {
      const extOn = duckSourceIdx === 1;
      const baseTip = 'Select an active Werewolf Digital Beacon track for external reverb ducking key. Wireless cross-track key — for sample-exact timing at large DAW buffer sizes (1024+), use Off (Host Bus) with a DAW sidechain send.';
      wrap.classList.remove('receiving', 'waiting', 'mismatch');
      if (beaconSelected) {
        if (beaconSrMismatch) {
          wrap.classList.add('mismatch');
          wrap.title = 'Sample rate mismatch between this track and the selected WD Beacon track.';
        } else {
          wrap.classList.add(extOn && beaconReceiving ? 'receiving' : 'waiting');
          wrap.title = extOn ? baseTip : (baseTip + ' (Duck Key is currently Int.)');
        }
      } else if (extOn) {
        wrap.classList.add(scActive ? 'receiving' : 'waiting');
        wrap.title = scActive
          ? 'Receiving external ducking key from Host Bus 1.'
          : baseTip;
      } else {
        wrap.title = baseTip;
      }
    }
    updateDuckKeyHint();
  }

  function renderBeaconSources(res) {
    const sel = $('beaconSourceSelect');
    if (!sel || !res || typeof res !== 'object') return;
    const sources = Array.isArray(res.sources) ? res.sources : [];
    if (typeof res.selected === 'string') beaconSelected = res.selected;
    if (!beaconMetersSeen && typeof res.receiving === 'boolean') beaconReceiving = res.receiving;
    if (!beaconMetersSeen && typeof res.scActive === 'boolean') scActive = res.scActive;
    if (typeof res.srMismatch === 'boolean') beaconSrMismatch = res.srMismatch;

    const sig = sources.map(s => `${s.name}:${s.sr}:${s.ch}`).join('|') + '#' + beaconSelected;
    updateBeaconLed();
    updateDuckState();
    if (document.activeElement === sel || sig === lastBeaconSig) return;
    lastBeaconSig = sig;

    sel.textContent = '';
    const off = document.createElement('option');
    off.value = '';
    off.textContent = 'Off (Host Bus)';
    sel.appendChild(off);

    let found = (beaconSelected === '');
    for (const s of sources) {
      const opt = document.createElement('option');
      opt.value = s.name;
      const sr = s.sr ? (s.sr / 1000).toFixed(s.sr % 1000 === 0 ? 0 : 1) + 'k' : '?';
      const ch = s.ch === 1 ? 'Mono' : s.ch === 2 ? 'St' : (s.ch + 'ch');
      opt.textContent = `${s.name} (${sr} · ${ch})`;
      if (s.name === beaconSelected) found = true;
      sel.appendChild(opt);
    }
    if (!found && beaconSelected) {
      const offline = document.createElement('option');
      offline.value = beaconSelected;
      offline.textContent = `${beaconSelected} (waiting…)`;
      sel.appendChild(offline);
    }
    sel.value = beaconSelected;
  }

  async function refreshBeaconSources() {
    if (!host) return;
    try {
      const res = await host.call('getBeaconSources');
      renderBeaconSources(res);
    } catch (e) {}

  {
    const sel = $('beaconSourceSelect');
    if (sel) {
      sel.addEventListener('pointerdown', refreshBeaconSources);
      sel.addEventListener('focus', refreshBeaconSources);
      sel.addEventListener('change', async () => {
        beaconSelected = sel.value || '';
        beaconSrMismatch = false;
        if (beaconSelected && duckSourceIdx !== 1) {
          duckSourceIdx = 1;
          setComboIndex('ducksource', 1);
          if (syncDuckSourcePills) syncDuckSourcePills(1);
        }
        updateBeaconLed();
        updateDuckState();
        drawTail();
        if (host) {
          beaconRpcInFlight = true;
          try {
            const res = await host.call('setBeaconSource', beaconSelected);
            if (res && typeof res.receiving === 'boolean') beaconReceiving = res.receiving;
            if (res && typeof res.scActive === 'boolean') scActive = res.scActive;
            if (res && typeof res.srMismatch === 'boolean') beaconSrMismatch = res.srMismatch;
            updateBeaconLed();
            updateDuckState();
          } catch (e) {}
          beaconRpcInFlight = false;
        }
      });
    }
  }

  function updateModState() {
    const d = sl('moddepth'), r = sl('modrate');
    if (!d || !r) return;
    const depth = d.getScaledValue();
    $('modState').textContent = depth < 0.5 ? 'Still' : (Math.round(depth) + '% at ' + r.getScaledValue().toFixed(2) + ' Hz');
  }
  function updateDuckState() {
    const el = $('duckState');
    if (!el) return;
    const d = sl('duckdepth'), t = sl('duckthresh');
    const depth = d ? d.getScaledValue() : 6.0;
    const thresh = t ? t.getScaledValue() : -18.0;

    if (duckSourceIdx === 1) {
      const hasKeySignal = beaconSelected ? beaconReceiving : scActive;
      el.textContent = '';
      const badge = document.createElement('span');
      badge.className = 'duck-badge' + (hasKeySignal ? '' : ' idle');
      badge.textContent = beaconSelected ? ('Key · ' + beaconSelected) : 'Key';
      el.appendChild(badge);

      const txt = document.createElement('span');
      if (liveDuckDb <= -0.05) txt.textContent = liveDuckDb.toFixed(1) + ' dB';
      else if (depth < 0.05) txt.textContent = 'Off';
      else txt.textContent = depth.toFixed(1) + ' dB over ' + thresh.toFixed(0) + ' dB';
      el.appendChild(txt);
      return;
    }

    if (liveDuckDb <= -0.05) {
      el.textContent = liveDuckDb.toFixed(1) + ' dB';
      return;
    }
    if (!d || !t) {
      el.textContent = '—';
      return;

    ? WDKit.createBeaconEpochWatcher(refreshBeaconSources)

  if (window.WDKit && WDKit.syncGlobalTheme) {
    WDKit.syncGlobalTheme(host, t => applyTheme(t));

  setTimeout(async () => {
    initAll();
    fitDecayCanvas();
    fitTailCanvas();

    if (host) {
      try {
        const uiState = await host.call('getUiState');
        if (uiState) {
          if (uiState.build) $('buildTag').textContent = uiState.build;

          if (window.WDKit && WDKit.bindBrandDiagnostics) {
            WDKit.bindBrandDiagnostics(document.querySelector('.brand'), {

            });

          if (typeof uiState.selfCustomName === 'string') selfMeta.customName = uiState.selfCustomName;
          if (typeof uiState.beaconPublishedName === 'string') selfMeta.publishedName = uiState.beaconPublishedName;
          if (typeof uiState.beaconPublishing === 'boolean') selfMeta.publishing = uiState.beaconPublishing;
          if (typeof uiState.beaconSource === 'string') beaconSelected = uiState.beaconSource;
          if (typeof uiState.beaconReceiving === 'boolean') beaconReceiving = uiState.beaconReceiving;
          if (typeof uiState.scActive === 'boolean') scActive = uiState.scActive;
          if (typeof uiState.beaconSrMismatch === 'boolean') beaconSrMismatch = uiState.beaconSrMismatch;
          renderSelfTrackChip();

      } catch (e) { console.warn('getUiState call failed', e); }

      renderSelfTrackChip();
      updateBeaconLed();

  }, 120);

  // ------------------------------------------------------------ live meters
  let mIn = -120, mOut = -120;
  let binaryActive = false;

  function applyPeakMeters(inL, inR, outL, outR) {
    const inMax = Math.max(Number.isFinite(inL) ? inL : -120, Number.isFinite(inR) ? inR : -120);
    const outMax = Math.max(Number.isFinite(outL) ? outL : -120, Number.isFinite(outR) ? outR : -120);
    mIn += (inMax - mIn) * (inMax > mIn ? 0.8 : 0.15);
    mOut += (outMax - mOut) * (outMax > mOut ? 0.8 : 0.15);

    const text = db => db <= DB_FLOOR + 0.5 ? '—' : db.toFixed(1) + ' dB';
    $('inVal').textContent = text(mIn);
    $('outVal').textContent = text(mOut);
    const pct = db => (clamp((db - DB_FLOOR) / -DB_FLOOR, 0, 1) * 100).toFixed(1) + '%';
    $('inBar').style.setProperty('--fill', pct(mIn));
    $('outBar').style.setProperty('--fill', pct(mOut));
    return { inMax, outMax };
  }

  const tailScrollLoop = (window.WDKit && typeof WDKit.createRenderLoop === 'function')
    ? WDKit.createRenderLoop(() => {
        if (histCount === 0) return false;
        drawTail();
        return (nowSec() - newestAudibleSec) <= (activeTailSpan() + 0.12);
      })
    : null;

  function appendHistSample(t, inVal, wetVal, duckVal, keyVal) {
    histHead = histCount === 0 ? 0 : ((histHead + 1) % HIST_CAP);
    if (histCount < HIST_CAP) ++histCount;
    histTime[histHead] = t;
    histIn[histHead]   = inVal;
    histWet[histHead]  = wetVal;
    histDuck[histHead] = duckVal;
    histSc[histHead]   = keyVal;
    if (inVal > DB_FLOOR + 0.2 || wetVal > DB_FLOOR + 0.2 || duckVal < -0.05 || keyVal > DB_FLOOR + 0.2)
      newestAudibleSec = Math.max(newestAudibleSec, t);
  }

  function pushTailHistory(inMax, wetDb, duckDb, keyDb) {
    const t = nowSec();
    const inVal   = Number.isFinite(inMax) ? inMax : -120;
    const wetVal  = Number.isFinite(wetDb) ? wetDb : -120;
    const duckVal = Number.isFinite(duckDb) ? duckDb : 0;
    const keyVal  = Number.isFinite(keyDb) ? keyDb : -120;

    if (histCount > 0) {
      const prevT = histTime[histHead];
      if (t - prevT > 0.35) {
        appendHistSample(prevT + 0.02, -120, -120, 0, -120);
        appendHistSample(t - 0.02, -120, -120, 0, -120);
      }
    }
    appendHistSample(t, inVal, wetVal, duckVal, keyVal);
    drawTail();
    if (tailScrollLoop && (t - newestAudibleSec) <= (activeTailSpan() + 0.12))
      tailScrollLoop.wake();
  }

  function updateMeters(meters) {
    beaconMetersSeen = true;
    if (beaconEpochWatch) beaconEpochWatch(meters);
    if (typeof meters.beaconReceiving === 'boolean') beaconReceiving = meters.beaconReceiving;
    if (typeof meters.scActive === 'boolean') scActive = meters.scActive;
    if (typeof meters.beaconSrMismatch === 'boolean') beaconSrMismatch = meters.beaconSrMismatch;
    if (Number.isFinite(meters.sc)) scPeakDb = meters.sc;
    if (Number.isFinite(meters.duckDb)) liveDuckDb = meters.duckDb;
    if (typeof meters.beaconSource === 'string' && !beaconRpcInFlight) {
      if (beaconSelected !== meters.beaconSource) {
        beaconSelected = meters.beaconSource;
        lastBeaconSig = '';
        refreshBeaconSources();
      }
    }
    if (typeof meters.selfName === 'string' && !selfEditing) {
      const changed = (selfMeta.name !== meters.selfName
        || selfMeta.publishedName !== (meters.beaconPublishedName || '')
        || selfMeta.publishing !== !!meters.beaconPublishing);
      selfMeta.name = meters.selfName;
      if (typeof meters.selfCustomName === 'string') selfMeta.customName = meters.selfCustomName;
      if (typeof meters.beaconPublishedName === 'string') selfMeta.publishedName = meters.beaconPublishedName;
      if (typeof meters.beaconPublishing === 'boolean') selfMeta.publishing = meters.beaconPublishing;
      if (changed) renderSelfTrackChip();
    }
    updateBeaconLed();
    updateDuckState();

    if (!binaryActive || (meters.inL === 0 && meters.outL === 0)) {
      const { inMax, outMax } = applyPeakMeters(meters.inL, meters.inR, meters.outL, meters.outR);
      if (!binaryActive) {
        const wetVal = Number.isFinite(meters.wet) ? meters.wet : outMax;
        pushTailHistory(inMax, wetVal, liveDuckDb, scPeakDb);
        if (Array.isArray(meters.wetSpec) && meters.wetSpec.length >= SPEC_BINS)
          pushWetSpectrum(meters.wetSpec);
      }
    }
  }

  if (host) {
    host.on('meters', data => { if (data) updateMeters(data); });
    if (window.WDKit && WDKit.createTelemetryPoller) {
      const binPoller = WDKit.createTelemetryPoller(pkt => {
        if (pkt.kind !== 2 || pkt.floats.length < 7 + SPEC_BINS) return;
        binaryActive = true;
        const f = pkt.floats;
        scActive = !!(pkt.flags & 1);
        beaconReceiving = !!(pkt.flags & 2);
        beaconSrMismatch = !!(pkt.flags & 4);
        liveDuckDb = f[5];
        scPeakDb = f[6];
        updateBeaconLed();
        updateDuckState();
        const { inMax } = applyPeakMeters(f[0], f[1], f[2], f[3]);
        pushTailHistory(inMax, f[4], f[5], f[6]);
        pushWetSpectrum(f.subarray(7, 7 + SPEC_BINS));
      }, 12);
      binPoller.start();
    }
  } else {
    const demoSpec = new Float32Array(SPEC_BINS);
    setInterval(() => {
      const t = Date.now() * 0.001;
      const beat = t % 2.4;
      const dry = beat < 0.14 ? -6 - beat * 160 : (beat > 1.1 && beat < 1.24 ? -11 - (beat - 1.1) * 180 : -120);
      const hitAge = beat < 1.1 ? beat : (beat - 1.1);
      const preSec = predelayMs * 0.001;
      const keyLvl = (t % 0.8) < 0.18 ? -7 - 40 * (t % 0.18) : -54;
      const duckVal = duckSourceIdx === 1
        ? ((t % 0.8) < 0.22 ? -6.2 : -0.3)
        : (dry > -30 ? -4.8 : 0);
      const wetBase = hitAge < preSec
        ? -58
        : (frozen ? -14 : -13 - ((hitAge - preSec) * 60 / Math.max(0.25, globalDecay)));
      const wetLvl = wetBase + duckVal;
      for (let i = 0; i < SPEC_BINS; ++i) {
        const hz = FMIN * Math.pow(FMAX / FMIN, i / (SPEC_BINS - 1));
        const mult = Math.max(0.2, multiplierAt(hz));
        const bandAgeSlope = ((Math.max(0, hitAge - preSec)) * 60) / Math.max(0.2, globalDecay * mult);
        const modal = 3.2 * Math.sin(i * 0.24 + t * 2.1) + 1.8 * Math.cos(i * 0.61 - t * 1.3);
        const tilt = -7.5 * Math.log10(Math.max(1, hz / 180));
        demoSpec[i] = frozen
          ? (-22 + tilt + modal)
          : (-18 + tilt - bandAgeSlope + duckVal + modal);
      }
      updateMeters({
        inL: dry, inR: dry,
        outL: Math.max(dry, wetLvl), outR: Math.max(dry, wetLvl),
        wet: wetLvl,
        wetSpec: Array.from(demoSpec),
        sc: keyLvl,
        scActive: true,
        duckDb: duckVal
      });
    }, 1000 / HIST_HZ);
  }

})();
</script>
</body>
</html>
