<script type="module">
(async () => {
  'use strict';
  const $ = id => document.getElementById(id);

  // Canvas 2D Theme Literals
  const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const COL = {
    accent:    cssVar('--accent')     || '#4a90a8',
    accentLit: cssVar('--accent-lit') || '#83c2d6',
    accentDeep:cssVar('--accent-deep')|| '#1f5a6e',
    well:      cssVar('--well')       || '#06070a',
    cream:     cssVar('--cream')      || '#f2f5fa',
  };
  let uiReady = false;
  function applyTheme(theme) {
    const t = theme || 'studio';
    if (t === 'studio') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
    COL.accent = cssVar('--accent') || COL.accent;
    COL.accentLit = cssVar('--accent-lit') || COL.accentLit;
    COL.accentDeep = cssVar('--accent-deep') || COL.accentDeep;
    COL.well = cssVar('--well') || '#06070a';
    COL.cream = cssVar('--cream') || '#f2f5fa';
    const sw = document.getElementById('themeSwitcher');
    if (sw) {
      sw.querySelectorAll('.theme-btn').forEach(b => {
        b.classList.toggle('on', b.dataset.theme === t);
      });
    }
    try { localStorage.setItem('wd_theme', t); } catch (e) {}
    if (uiReady) { drawTime(); drawLoop(); drawXlfoCurve(); }
  }
  {
    let saved = 'studio';
    try { saved = localStorage.getItem('wd_theme') || 'studio'; } catch (e) {}
    applyTheme(saved);
    const sw = document.getElementById('themeSwitcher');
    if (sw) {
      sw.addEventListener('click', e => {
        const btn = e.target.closest('.theme-btn');
        if (btn && btn.dataset.theme) applyTheme(btn.dataset.theme);
      });
    }
  }
  const ink = a => 'rgba(242, 245, 250, ' + a + ')';
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  // ------------------------------------------------------------------ host
  let host = null;
  if (window.__JUCE__ && window.__JUCE__.backend) {
    try {
      const lib = await import('./juce/index.js');
      const be = window.__JUCE__.backend;
      host = {
        slider: id => lib.getSliderState(id),
        combo:  id => lib.getComboBoxState(id),
        toggle: id => lib.getToggleState(id),
        call:   (name, ...args) => lib.getNativeFunction(name)(...args),
        on:     (event, cb) => be.addEventListener(event, cb),
      };
    } catch (e) { console.warn('JUCE frontend unavailable:', e); }
  }

  const sliders = {}, combos = {}, toggles = {};
  const sl = id => { if (!host) return null; if (!sliders[id]) sliders[id] = host.slider(id); return sliders[id]; };
  const cb = id => { if (!host) return null; if (!combos[id]) combos[id] = host.combo(id); return combos[id]; };
  const tg = id => { if (!host) return null; if (!toggles[id]) toggles[id] = host.toggle(id); return toggles[id]; };

  const comboIndex = (id, n) => { const s = cb(id); return s ? Math.round((s.value || 0) * (n - 1)) : 0; };
  const setComboIndex = (id, i) => { const s = cb(id); if (s && s.setChoiceIndex) s.setChoiceIndex(i); };

  // Choice lists in DSP order (DelayProcessor.cpp).
  const SYNC_DIVS = [
    "1/64", "1/64t", "1/64d",
    "1/32", "1/32t", "1/32d",
    "1/16", "1/16t", "1/16d",
    "1/8",  "1/8t",  "1/8d",
    "1/4",  "1/4t",  "1/4d",
    "1/2",  "1/2t",  "1/2d",
    "1/1",  "1/1t",  "1/1d"
  ];
  const ROUTING = ["Normal", "Ping-Pong", "Cross"];
  const TAPEMODE = ["Digital", "Tape"];

  // --------------------------------------------------- slider / toggle binds
  function bindToggle(el, id, onValueChange = null) {
    const t = tg(id);
    if (!el || !t) return;
    if (el._wdToggleAbort) el._wdToggleAbort.abort();
    const ac = typeof AbortController === 'function' ? new AbortController() : null;
    el._wdToggleAbort = ac;
    const evOpts = ac ? { signal: ac.signal } : undefined;

    const updateDisplay = () => {
      const v = !!t.getValue();
      el.classList.toggle('on', v);
      if (onValueChange) onValueChange(v);
    };

    if (t.customListener) t.valueChangedEvent.removeListener(t.customListener);
    t.customListener = updateDisplay;
    t.valueChangedEvent.addListener(updateDisplay);
    updateDisplay();

    el.addEventListener('click', () => {
      t.setValue(!t.getValue());
      updateDisplay();
    }, evOpts);
  }

  function bindChoiceToggle(el, id, onValueChange = null) {
    if (!el) return;
    if (el._wdToggleAbort) el._wdToggleAbort.abort();
    const ac = typeof AbortController === 'function' ? new AbortController() : null;
    el._wdToggleAbort = ac;
    const evOpts = ac ? { signal: ac.signal } : undefined;

    const updateDisplay = () => {
      const v = comboIndex(id, 2) === 1;
      el.classList.toggle('on', v);
      if (onValueChange) onValueChange(v);
    };
    const s = cb(id);
    if (s) {
      if (s.customListener) s.valueChangedEvent.removeListener(s.customListener);
      s.customListener = updateDisplay;
      s.valueChangedEvent.addListener(updateDisplay);
    }
    updateDisplay();

    el.addEventListener('click', () => {
      setComboIndex(id, comboIndex(id, 2) === 1 ? 0 : 1);
      updateDisplay();
    }, evOpts);
  }

  function bindChoicePills(groupEl, id, choices, onChange = null) {
    if (!groupEl) return;
    groupEl.innerHTML = '';
    choices.forEach((name, i) => {
      const b = document.createElement('button');
      b.className = 'pill sm';
      b.dataset.index = String(i);
      b.textContent = name;
      groupEl.appendChild(b);
    });
    const buttons = groupEl.querySelectorAll('button');

    const updateDisplay = () => {
      const idx = comboIndex(id, choices.length);
      buttons.forEach(btn => btn.classList.toggle('on', parseInt(btn.dataset.index, 10) === idx));
      if (onChange) onChange(idx);
    };

    const s = cb(id);
    if (s) {
      if (s.customListener) s.valueChangedEvent.removeListener(s.customListener);
      s.customListener = updateDisplay;
      s.valueChangedEvent.addListener(updateDisplay);
    }
    updateDisplay();

    buttons.forEach(btn => btn.addEventListener('click', () => {
      setComboIndex(id, parseInt(btn.dataset.index, 10));
      updateDisplay();
    }));
  }

  const DIV_NOTES = ["1/64", "1/32", "1/16", "1/8", "1/4", "1/2", "1/1"];
  const DIV_FEELS = ["Triplet", "Dotted"];
  function bindDivisionPills(notesEl, feelsEl, id) {
    if (!notesEl || !feelsEl) return;
    const mk = (groupEl, names, cls) => {
      groupEl.innerHTML = '';
      names.forEach((name, i) => {
        const b = document.createElement('button');
        b.className = 'pill sm ' + cls;
        b.dataset.index = String(i);
        b.textContent = name;
        groupEl.appendChild(b);
      });
      return groupEl.querySelectorAll('button');
    };
    const notes = mk(notesEl, DIV_NOTES, 'note');
    const feels = mk(feelsEl, DIV_FEELS, 'feel');
    const current = () => {
      const idx = comboIndex(id, SYNC_DIVS.length);
      return { note: Math.floor(idx / 3), feel: idx % 3 };
    };
    const updateDisplay = () => {
      const c = current();
      notes.forEach(b => b.classList.toggle('on', parseInt(b.dataset.index, 10) === c.note));
      feels.forEach(b => b.classList.toggle('on', parseInt(b.dataset.index, 10) + 1 === c.feel));
      redrawTaps();
    };
    const s = cb(id);
    if (s) {
      if (s.customListener) s.valueChangedEvent.removeListener(s.customListener);
      s.customListener = updateDisplay;
      s.valueChangedEvent.addListener(updateDisplay);
    }
    updateDisplay();
    notes.forEach(b => b.addEventListener('click', () => {
      setComboIndex(id, parseInt(b.dataset.index, 10) * 3 + current().feel);
      updateDisplay();
    }));
    feels.forEach(b => b.addEventListener('click', () => {
      const feel = parseInt(b.dataset.index, 10) + 1;
      const c = current();
      setComboIndex(id, c.note * 3 + (c.feel === feel ? 0 : feel));
      updateDisplay();
    }));
  }

  // ------------------------------------------------------------ live state
  let liveDuckDb = 0;
  let liveInDb = -120, liveOutDb = -120, liveScDb = -120;
  const scTrace = [];
  const selfMeta = { name: 'Delay 1', customName: '', publishedName: '', publishing: false };
  let beaconSelected = '';
  let beaconReceiving = false;
  let scActive = false;
  let beaconSrMismatch = false;
  let beaconMetersSeen = false;
  let lastBeaconSig = '';
  let followerExtSc = false;
  let activeSlots = [];
  let xlfosState = [];
  let liveSourceVals = new Array(10).fill(0);
  let liveXlfoPhases = new Array(3).fill(0);
  let liveSlotVals = new Array(24).fill(0);
  let liveDestOffsets = [];
  const ringGestureOpen = {};
  let patchCords = null;

  for (let s = 0; s < 24; ++s)
    activeSlots.push({ index: s, source: -1, dest: -1, curve: 0, on: false, depth: 0.0 });

  for (let i = 0; i < 3; ++i) {
    const steps = [];
    for (let step = 0; step < 32; ++step)
      steps.push({ index: step, value: 0.5 - 0.5 * Math.cos(2 * Math.PI * ((step + 1) / 16)), glide: 100.0, slope: 0.0 });
    xlfosState.push({ index: i, numSteps: 16, isSynced: false, syncRateBeats: 1.0, retriggerMode: 0, steps });
  }

  const SRC_META = {
    0: { label: 'LFO 1', color: '#38bdf8' },
    1: { label: 'LFO 2', color: '#a78bfa' },
    2: { label: 'LFO 3', color: '#34d399' },
    4: { label: 'Env',   color: '#f59e0b' },
    5: { label: 'Note',  color: '#f472b6' },
    6: { label: 'Vel',   color: '#fb7185' },
    7: { label: 'Wheel', color: '#60a5fa' },
  };

  const DEST_OPTIONS = [
    { val: -1, label: "None" },
    { val: 1, label: "Tap A Time" },
    { val: 2, label: "Tap B Time" },
    { val: 3, label: "Feedback" },
    { val: 4, label: "Loop HP" },
    { val: 5, label: "Loop LP" },
    { val: 6, label: "Mix" },
    { val: 1000, label: "LFO 1 Rate" },
    { val: 1001, label: "LFO 2 Rate" },
    { val: 1002, label: "LFO 3 Rate" },
  ];
  for (let s = 0; s < 24; ++s)
    DEST_OPTIONS.push({ val: 2000 + s, label: 'Slot ' + (s + 1) + ' Depth' });

  const SRC_OPTIONS = [
    { val: -1, label: "None" },
    { val: 0, label: "LFO 1" },
    { val: 1, label: "LFO 2" },
    { val: 2, label: "LFO 3" },
    { val: 4, label: "Envelope" },
    { val: 5, label: "MIDI Note" },
    { val: 6, label: "Velocity" },
    { val: 7, label: "Mod Wheel" },
  ];

  function readTaps() {
    const taps = {
      a: { time: 500, modTime: 500, modOffset: 0, level: 100, pan: -100, sync: 0, div: 12, inv: 0 },
      b: { time: 500, modTime: 500, modOffset: 0, level: 100, pan: 100,  sync: 0, div: 12, inv: 0 },
    };
    let feedback = 40, cross = 0;
    if (host) {
      for (const k of ['a', 'b']) {
        const t = taps[k], p = 'tap' + k + '_';
        const st = sl(p + 'time'), sv = sl(p + 'level'), sp = sl(p + 'pan');
        if (st) t.time = st.getScaledValue();
        if (sv) t.level = sv.getScaledValue();
        if (sp) t.pan = sp.getScaledValue();
        t.sync = comboIndex(p + 'sync', 2);
        t.div = comboIndex(p + 'syncdiv', SYNC_DIVS.length);
        t.inv = comboIndex(p + 'invert', 2);
      }
      const fb = sl('feedback'); if (fb) feedback = fb.getScaledValue();
      const cr = sl('cross');    if (cr) cross = cr.getScaledValue();
    }
    taps.a.modOffset = liveDestOffsets[1] || 0;
    taps.b.modOffset = liveDestOffsets[2] || 0;
    taps.a.modTime = taps.a.sync ? taps.a.time : clamp(taps.a.time + taps.a.modOffset, 1.0, 4000.0);
    taps.b.modTime = taps.b.sync ? taps.b.time : clamp(taps.b.time + taps.b.modOffset, 1.0, 4000.0);
    return { taps, feedback, cross };
  }

  // ---------------------------------------------------------- time well
  const timeCanvas = $('timeCanvas');
  const timeCtx = timeCanvas.getContext('2d');
  let tW = 0, tH = 0, tDpr = 1;

  function fitTimeCanvas() {
    tDpr = window.devicePixelRatio || 1;
    const r = timeCanvas.getBoundingClientRect();
    tW = r.width; tH = r.height;
    timeCanvas.width = Math.round(tW * tDpr);
    timeCanvas.height = Math.round(tH * tDpr);
    timeCtx.setTransform(tDpr, 0, 0, tDpr, 0, 0);
    drawTime();
  }
  new ResizeObserver(fitTimeCanvas).observe(timeCanvas);

  const T_PAD = 24, T_AXIS = 20, T_HEAD = 30;
  const MS_MIN = 1.0, MS_MAX = 4000.0;
  const msToX = ms => T_PAD + (Math.log(clamp(ms, MS_MIN, MS_MAX) / MS_MIN) / Math.log(MS_MAX / MS_MIN)) * (tW - T_PAD * 2);
  const xToMs = x => MS_MIN * Math.pow(MS_MAX / MS_MIN, clamp((x - T_PAD) / (tW - T_PAD * 2), 0, 1));
  const divToX = idx => T_PAD + clamp(idx / (SYNC_DIVS.length - 1), 0, 1) * (tW - T_PAD * 2);
  const xToDiv = x => Math.round(clamp((x - T_PAD) / (tW - T_PAD * 2), 0, 1) * (SYNC_DIVS.length - 1));

  const tapX = t => t.sync ? divToX(t.div) : msToX(t.time);
  const fmtMsShort = ms => ms >= 1000 ? (ms / 1000).toFixed(2).replace(/0+$/, '').replace(/\.$/, '') + ' s'
                                      : (ms < 10 ? ms.toFixed(1) : Math.round(ms)) + ' ms';

  let dragTap = null;

  function drawTime() {
    timeCtx.clearRect(0, 0, tW, tH);
    if (tW < 60 || tH < 60) return;

    const foot = tH - T_AXIS;
    const plotH = foot - T_HEAD;
    const levelY = lvl => foot - clamp(lvl / 100, 0, 1) * plotH;
    const { taps, feedback } = readTaps();
    const fb = clamp(feedback / 100, 0, 1.2);

    // Repeat train in cream alpha (follows modulated tap time when active)
    for (const k of ['a', 'b']) {
      const t = taps[k];
      if (t.sync || fb < 0.02) continue;
      let lvl = t.level;
      const baseMs = t.modTime;
      for (let n = 2; n <= 12; ++n) {
        lvl *= fb;
        const ms = baseMs * n;
        if (ms > MS_MAX || lvl < 1) break;
        const x = msToX(ms);
        timeCtx.fillStyle = ink(0.16);
        timeCtx.fillRect(x - 2.5, levelY(lvl), 5, foot - levelY(lvl));
      }
    }

    // Axis marks in cream 34%
    timeCtx.font = '600 10px ' + cssVar('--font');
    timeCtx.fillStyle = ink(0.34);
    timeCtx.textAlign = 'center';
    timeCtx.textBaseline = 'alphabetic';
    [1, 10, 100, 1000, 4000].forEach(ms => {
      timeCtx.fillText(ms >= 1000 ? (ms / 1000) + ' s' : ms + ' ms', msToX(ms), tH - 6);
    });

    // Tap guides & handles
    for (const k of ['a', 'b']) {
      const t = taps[k];
      const x = tapX(t);
      const modActive = !t.sync && Math.abs(t.modOffset) > 0.1;
      const modX = modActive ? msToX(t.modTime) : x;
      const dragging = dragTap === k;
      const setY = levelY(t.level);

      // Setting guide line in accent-lit (2.6px)
      timeCtx.fillStyle = COL.accentLit;
      timeCtx.fillRect(x - 1.3, setY, 2.6, foot - setY);

      // Live modulated tap bar & tip dot when modulation moves tap time
      if (modActive && t.level > 0.5) {
        const modLvl = liveDuckDb > 0.05 ? t.level * Math.pow(10, -liveDuckDb / 20) : t.level;
        const my = levelY(modLvl);
        timeCtx.fillStyle = ink(0.92);
        timeCtx.fillRect(modX - 1.7, my, 3.4, foot - my);
        timeCtx.beginPath();
        timeCtx.arc(modX, my, 4, 0, Math.PI * 2);
        timeCtx.fillStyle = COL.cream;
        timeCtx.fill();
      } else if (liveDuckDb > 0.05 && t.level > 0.5) {
        // Live ducked level in cream 92% (3.4px) with dot tip
        const liveLvl = t.level * Math.pow(10, -liveDuckDb / 20);
        const ly = levelY(liveLvl);
        timeCtx.fillStyle = ink(0.92);
        timeCtx.fillRect(x - 1.7, ly, 3.4, foot - ly);
        timeCtx.beginPath();
        timeCtx.arc(x, ly, 4, 0, Math.PI * 2);
        timeCtx.fillStyle = COL.cream;
        timeCtx.fill();
      }

      // Handle pill in cream
      const { bx, tw, label } = tapPillBounds(k, t, tW);
      timeCtx.fillStyle = COL.cream;
      timeCtx.beginPath();
      if (timeCtx.roundRect) timeCtx.roundRect(bx, 2, tw, 20, 10);
      else timeCtx.rect(bx, 2, tw, 20);
      timeCtx.fill();

      timeCtx.fillStyle = dragging ? COL.accentDeep : COL.well;
      timeCtx.textAlign = 'center';
      timeCtx.textBaseline = 'middle';
      timeCtx.fillText(label, bx + tw / 2, 12);
      timeCtx.textBaseline = 'alphabetic';
    }

    // External Duck Key live cyan trace & badge when Duck Key = External
    if (comboIndex('ducksource', 2) === 1) {
      const scBarW = Math.min(180, Math.max(100, tW * 0.28));
      const scNorm = clamp((liveScDb + 60) / 60, 0, 1);

      if (scTrace.length > 1) {
        const traceH = Math.max(18, plotH * 0.42);
        timeCtx.beginPath();
        for (let i = 0; i < scTrace.length; ++i) {
          const tx = T_PAD + (i / Math.max(1, scTrace.length - 1)) * (tW - T_PAD * 2);
          const ty = foot - clamp((scTrace[i] + 60) / 60, 0, 1) * traceH;
          if (i === 0) timeCtx.moveTo(tx, ty);
          else timeCtx.lineTo(tx, ty);
        }
        timeCtx.strokeStyle = 'rgba(56, 189, 248, 0.72)';
        timeCtx.lineWidth = 1.6;
        timeCtx.stroke();

        timeCtx.lineTo(tW - T_PAD, foot);
        timeCtx.lineTo(T_PAD, foot);
        timeCtx.closePath();
        timeCtx.fillStyle = 'rgba(2, 132, 199, 0.14)';
        timeCtx.fill();
      }

      const keySource = beaconSelected || 'Host Bus 1';
      const keyStatus = beaconSelected
        ? (beaconSrMismatch ? 'SR Mismatch' : (beaconReceiving ? (liveScDb > -118 ? liveScDb.toFixed(1) + ' dB' : 'Ready') : 'Waiting'))
        : (scActive ? liveScDb.toFixed(1) + ' dB' : 'Silent');
      const badgeText = 'KEY · ' + keySource + ' · ' + keyStatus;
      timeCtx.font = '700 10px ' + cssVar('--font');
      const bw = Math.min(tW - 16, Math.max(scBarW, timeCtx.measureText(badgeText).width + 24));
      const bx = tW - bw - 8;
      const by = Math.max(T_HEAD + 2, foot - 26);

      timeCtx.fillStyle = 'rgba(6, 12, 20, 0.86)';
      timeCtx.strokeStyle = beaconSrMismatch ? '#ef4444' : 'rgba(56, 189, 248, 0.55)';
      timeCtx.lineWidth = 1;
      timeCtx.beginPath();
      if (timeCtx.roundRect) timeCtx.roundRect(bx, by, bw, 20, 6);
      else timeCtx.rect(bx, by, bw, 20);
      timeCtx.fill();
      timeCtx.stroke();

      if (scNorm > 0.01) {
        timeCtx.fillStyle = 'rgba(2, 132, 199, 0.34)';
        timeCtx.beginPath();
        if (timeCtx.roundRect) timeCtx.roundRect(bx + 1, by + 1, Math.max(4, (bw - 2) * scNorm), 18, 5);
        else timeCtx.rect(bx + 1, by + 1, Math.max(4, (bw - 2) * scNorm), 18);
        timeCtx.fill();
      }

      timeCtx.fillStyle = '#38bdf8';
      timeCtx.beginPath();
      timeCtx.arc(bx + 10, by + 10, 3, 0, Math.PI * 2);
      timeCtx.fill();

      timeCtx.textAlign = 'left';
      timeCtx.textBaseline = 'middle';
      timeCtx.fillText(badgeText, bx + 17, by + 10.5, bw - 22);
      timeCtx.textBaseline = 'alphabetic';
    }
  }

  function tapPillBounds(k, t, w) {
    const width = w || tW || timeCanvas.getBoundingClientRect().width || 0;
    const x = tapX(t);
    const label = k.toUpperCase() + '  ' + (t.sync ? SYNC_DIVS[t.div] : fmtMsShort(t.time))
                + (t.inv ? '  −' : '');
    timeCtx.font = '700 11px ' + cssVar('--font');
    const measured = timeCtx.measureText(label);
    const rawTw = (measured && Number.isFinite(measured.width) ? measured.width : 0) + 16;
    const tw = Math.max(65, rawTw);
    const bx = clamp(x - tw / 2, 2, Math.max(2, width - tw - 2));
    return { x, bx, tw, label };
  }

  function tapNear(mx) {
    const { taps } = readTaps();
    const w = tW || timeCanvas.getBoundingClientRect().width || 0;
    const pA = tapPillBounds('a', taps.a, w);
    const pB = tapPillBounds('b', taps.b, w);
    const da = Math.abs(mx - pA.x), db = Math.abs(mx - pB.x);
    const hitA = da <= 24 || (mx >= pA.bx && mx <= pA.bx + pA.tw);
    const hitB = db <= 24 || (mx >= pB.bx && mx <= pB.bx + pB.tw);
    if (!hitA && !hitB) return null;
    if (hitA && hitB) {
      if (Math.abs(da - db) < 6) return currentPane === 'tapb' ? 'b' : 'a';
      return da < db ? 'a' : 'b';
    }
    return hitA ? 'a' : 'b';
  }

  timeCanvas.addEventListener('pointerdown', ev => {
    if ((ev.button ?? 0) !== 0) return;
    const r = timeCanvas.getBoundingClientRect();
    const k = tapNear(ev.clientX - r.left);
    if (!k) return;
    dragTap = k;
    timeCanvas.setPointerCapture(ev.pointerId);
    if (host) {
      const st = sl('tap' + k + '_time'), sv = sl('tap' + k + '_level');
      if (st) st.sliderDragStarted();
      if (sv) sv.sliderDragStarted();
    }
    ev.preventDefault();
    drawTime();
  });

  timeCanvas.addEventListener('pointermove', ev => {
    const r = timeCanvas.getBoundingClientRect();
    const mx = ev.clientX - r.left, my = ev.clientY - r.top;
    if (!dragTap) {
      timeCanvas.style.cursor = tapNear(mx) ? 'move' : 'default';
      return;
    }
    const k = dragTap, p = 'tap' + k + '_';
    if (host) {
      if (comboIndex(p + 'sync', 2)) {
        setComboIndex(p + 'syncdiv', xToDiv(mx));
      } else {
        const s = sl(p + 'time');
        if (s) {
          const pr = s.properties || { start: 1, end: 4000, skew: 1 };
          const lin = clamp((xToMs(mx) - pr.start) / (pr.end - pr.start), 0, 1);
          s.setNormalisedValue(Math.pow(lin, pr.skew || 1));
        }
      }
      const sv = sl(p + 'level');
      if (sv) {
        const foot = tH - T_AXIS, plotH = foot - T_HEAD;
        const lvl = clamp((foot - my) / plotH, 0, 1);
        sv.setNormalisedValue(lvl);
      }
    }
    drawTime();
  });

  function endTimeDrag(ev) {
    if (dragTap) {
      if (host) {
        const st = sl('tap' + dragTap + '_time'), sv = sl('tap' + dragTap + '_level');
        if (st) st.sliderDragEnded();
        if (sv) sv.sliderDragEnded();
      }
      dragTap = null;
      drawTime();
    }
    try { timeCanvas.releasePointerCapture(ev.pointerId); } catch (e) {}
  }
  timeCanvas.addEventListener('pointerup', endTimeDrag);
  timeCanvas.addEventListener('pointercancel', endTimeDrag);

  // ---------------------------------------------------------- loop well
  const loopCanvas = $('loopCanvas');
  const loopCtx = loopCanvas.getContext('2d');
  let lW = 0, lH = 0, lDpr = 1;

  function fitLoopCanvas() {
    lDpr = window.devicePixelRatio || 1;
    const r = loopCanvas.getBoundingClientRect();
    lW = r.width; lH = r.height;
    loopCanvas.width = Math.round(lW * lDpr);
    loopCanvas.height = Math.round(lH * lDpr);
    loopCtx.setTransform(lDpr, 0, 0, lDpr, 0, 0);
    drawLoop();
  }
  new ResizeObserver(fitLoopCanvas).observe(loopCanvas);

  const FMIN = 10.0, FMAX = 20000.0;
  const hzToX = hz => clamp((Math.log(hz / FMIN) / Math.log(FMAX / FMIN)) * lW, 0, lW);

  function drawLoop() {
    loopCtx.clearRect(0, 0, lW, lH);
    if (lW < 40 || lH < 40) return;

    const axis = 20;
    const plotH = lH - axis;
    let hpHz = 10, lpHz = 20000, driveDb = 0;
    if (host) {
      const hp = sl('hp'), lp = sl('lp'), dr = sl('drive');
      if (hp) hpHz = hp.getScaledValue();
      if (lp) lpHz = lp.getScaledValue();
      if (dr) driveDb = dr.getScaledValue();
    }

    // Passband wash in cream alpha
    loopCtx.fillStyle = ink(0.055);
    loopCtx.fillRect(hzToX(hpHz), 0, hzToX(lpHz) - hzToX(hpHz), plotH);

    // Decade marks in cream 34%
    loopCtx.font = '600 10px ' + cssVar('--font');
    loopCtx.fillStyle = ink(0.34);
    loopCtx.textAlign = 'center';
    loopCtx.textBaseline = 'alphabetic';
    [20, 50, 100, 200, 500, 1000, 2000, 5000, 10000].forEach(hz => {
      loopCtx.fillText(hz >= 1000 ? (hz / 1000) + 'k' : String(hz), hzToX(hz), lH - 6);
    });

    // Setting response in accent-lit 2.6px
    const top = 12, bottom = plotH - 8;
    const dbToY = db => top + (1 - clamp((db + 36) / 42, 0, 1)) * (bottom - top);
    loopCtx.strokeStyle = COL.accentLit;
    loopCtx.lineWidth = 2.6;
    loopCtx.lineJoin = 'round';
    loopCtx.lineCap = 'round';
    loopCtx.beginPath();
    for (let px = 0; px <= lW; ++px) {
      const f = FMIN * Math.pow(FMAX / FMIN, px / lW);
      const hp = f / Math.sqrt(f * f + hpHz * hpHz);
      const lp = lpHz / Math.sqrt(f * f + lpHz * lpHz);
      const db = 20 * Math.log10(Math.max(1e-6, hp * lp)) + driveDb * 0.25;
      const y = dbToY(db);
      px ? loopCtx.lineTo(px, y) : loopCtx.moveTo(px, y);
    }
    loopCtx.stroke();
  }

  // -------------------------------------------------------------- panes
  const PANES = ['tapa', 'tapb', 'loop', 'tone', 'duck', 'mix'];
  let currentPane = 'tapa';

  function paneTitle(p) {
    const { taps, feedback } = readTaps();
    const tapText = (k) => {
      const t = taps[k];
      const where = t.pan === 0 ? 'centre' : (t.pan < 0 ? 'left ' + Math.abs(Math.round(t.pan)) : 'right ' + Math.round(t.pan));
      return (t.sync ? SYNC_DIVS[t.div] + ' synced' : fmtMsShort(t.time)) + ' · ' + where;
    };
    switch (p) {
      case 'tapa': return 'Tap A · ' + tapText('a');
      case 'tapb': return 'Tap B · ' + tapText('b');
      case 'loop': return Math.round(feedback) + '% feedback';
      case 'tone': return 'What each repeat keeps';
      case 'duck': return comboIndex('ducksource', 2) === 1
        ? ('Repeats duck under ' + (beaconSelected || 'Host Sidechain Bus 1'))
        : 'Repeats duck under the dry signal';
      case 'mix':  return 'Dry against wet';
    }
    return '';
  }

  function selectPane(p) {
    currentPane = p;
    PANES.forEach(q => {
      const btn = $('sel_' + q);
      if (btn) btn.classList.toggle('on', q === p);
      const pane = $('pane_' + q);
      if (pane) pane.classList.toggle('active', q === p);
    });
    refreshTitle();
  }

  function refreshTitle() {
    const t = $('active_band_title');
    if (t) t.textContent = paneTitle(currentPane);
  }

  PANES.forEach(p => {
    const btn = $('sel_' + p);
    if (btn) btn.addEventListener('click', () => selectPane(p));
  });

  // ------------------------------------------------------------- modulation
  let currentXlfoIdx = 0;
  const xlfoTabs = document.querySelectorAll('#xlfo-tabs button');
  function selectXlfoTab(idx) {
    currentXlfoIdx = clamp(idx, 0, 2);
    xlfoTabs.forEach((t, i) => t.classList.toggle('on', i === currentXlfoIdx));
    document.querySelectorAll('.lfoset').forEach(s =>
      s.classList.toggle('active', s.dataset.lfo === String(currentXlfoIdx + 1)));
    document.querySelectorAll('#sourceBar .wd-src-pill').forEach(p => {
      p.classList.toggle('on', parseInt(p.dataset.sourceId, 10) === currentXlfoIdx);
    });
    drawXlfoCurve();
  }

  xlfoTabs.forEach((tab, idx) => {
    tab.addEventListener('click', () => selectXlfoTab(idx));
  });

  document.querySelectorAll('#sourceBar .wd-src-pill').forEach(pill => {
    pill.addEventListener('click', () => {
      const sid = parseInt(pill.dataset.sourceId, 10);
      document.querySelectorAll('#sourceBar .wd-src-pill').forEach(p => p.classList.toggle('on', p === pill));
      if (sid >= 0 && sid <= 2) selectXlfoTab(sid);
    });
  });

  // ------------------------------------------------------------ XLFO canvas
  const xCanvas = $('xlfoCanvas');
  const xCtx = xCanvas.getContext('2d');
  let xW = 0, xH = 0, xDpr = 1;
  let dragHandleIdx = -1;
  let dragStartPos = null;
  const X_AXIS = 10, X_PAD_TOP = 6;

  function fitXCanvas() {
    xDpr = window.devicePixelRatio || 1;
    const r = xCanvas.getBoundingClientRect();
    xW = r.width; xH = r.height;
    xCanvas.width = Math.round(xW * xDpr);
    xCanvas.height = Math.round(xH * xDpr);
    xCtx.setTransform(xDpr, 0, 0, xDpr, 0, 0);
    drawXlfoCurve();
  }
  new ResizeObserver(fitXCanvas).observe(xCanvas);

  function xBent(u, slope) {
    if (Math.abs(slope) <= 1e-6) return u;
    return slope > 0 ? Math.pow(u, 1.0 - slope * 0.95) : Math.pow(u, 1.0 - slope * 19.0);
  }

  function xPatternAt(xlfo, u) {
    const n = xlfo.numSteps || 16;
    const i = clamp(Math.floor(u * n), 0, n - 1);
    const local = u * n - i;
    const prev = xlfo.steps[(i - 1 + n) % n].value;
    const curr = xlfo.steps[i].value;
    const g = xlfo.steps[i].glide / 100.0;
    if (g > 0 && local < g) return prev + xBent(local / g, xlfo.steps[i].slope) * (curr - prev);
    return curr;
  }

  const xPlotH = () => Math.max(12, xH - X_AXIS - X_PAD_TOP);
  const xYFor = v => X_PAD_TOP + (1.0 - v) * xPlotH();

  function drawXlfoCurve() {
    xCtx.clearRect(0, 0, xW, xH);
    if (xW < 40 || xH < 24) return;
    const xlfo = xlfosState[currentXlfoIdx];
    if (!xlfo) return;
    const n = xlfo.numSteps || 16;
    const stepW = xW / n;

    xCtx.strokeStyle = ink(0.07);
    xCtx.lineWidth = 1;
    for (let i = 1; i < n; ++i) {
      const bx = Math.round(i * stepW);
      xCtx.beginPath(); xCtx.moveTo(bx, X_PAD_TOP); xCtx.lineTo(bx, xH - X_AXIS); xCtx.stroke();
    }

    const trace = (from, to) => {
      xCtx.beginPath();
      let first = true;
      for (let px = from; px <= to; ++px) {
        const y = xYFor(xPatternAt(xlfo, clamp(px / xW, 0, 0.999999)));
        first ? xCtx.moveTo(px, y) : xCtx.lineTo(px, y);
        first = false;
      }
      xCtx.stroke();
    };
    xCtx.lineWidth = 2.2;
    xCtx.lineJoin = 'round';
    xCtx.lineCap = 'round';
    xCtx.strokeStyle = COL.accentLit;
    trace(0, Math.round(xW));

    const phase = liveXlfoPhases[currentXlfoIdx];
    if (typeof phase === 'number' && phase > 0) {
      const px = clamp(Math.round(phase * xW), 0, xW);
      xCtx.lineWidth = 2.8;
      xCtx.strokeStyle = ink(0.92);
      trace(0, px);
      const tipY = xYFor(xPatternAt(xlfo, clamp(phase, 0, 0.999999)));
      xCtx.fillStyle = COL.cream;
      xCtx.beginPath();
      xCtx.arc(px, tipY, 3.2, 0, Math.PI * 2);
      xCtx.fill();
    }

    for (let i = 0; i < n; ++i) {
      const hx = (i + 1) * stepW;
      const hy = xYFor(xlfo.steps[i].value);
      xCtx.fillStyle = dragHandleIdx === i ? COL.accentLit : COL.cream;
      xCtx.beginPath();
      if (xCtx.roundRect) xCtx.roundRect(hx - 3.5, hy - 3.5, 7, 7, 2);
      else xCtx.rect(hx - 3.5, hy - 3.5, 7, 7);
      xCtx.fill();
    }
  }

  async function saveStep(xlfoIdx, stepIdx) {
    const xlfo = xlfosState[xlfoIdx];
    if (!xlfo) return;
    const step = xlfo.steps[stepIdx];
    if (host) {
      try {
        await host.call('setXlfoStep', xlfoIdx, stepIdx, step.value, step.glide, step.slope);
      } catch (e) { console.error('Error saving step:', e); }
    }
  }

  async function saveXlfoConfig(xlfoIdx) {
    const xlfo = xlfosState[xlfoIdx];
    if (!xlfo) return;
    if (host) {
      try {
        await host.call('setXlfoConfig', xlfoIdx, xlfo.numSteps, xlfo.isSynced, xlfo.syncRateBeats, xlfo.retriggerMode);
      } catch (e) { console.error('Error saving XLFO config:', e); }
    }
  }

  xCanvas.addEventListener('pointerdown', ev => {
    if ((ev.button ?? 0) !== 0) return;
    const r = xCanvas.getBoundingClientRect();
    const mx = ev.clientX - r.left;
    const my = ev.clientY - r.top;
    const xlfo = xlfosState[currentXlfoIdx];
    if (!xlfo) return;
    const n = xlfo.numSteps || 16;
    const stepW = xW / n;

    dragHandleIdx = -1;
    for (let i = 0; i < n; ++i) {
      const hx = (i + 1) * stepW;
      const hy = xYFor(xlfo.steps[i].value);
      if (Math.hypot(mx - hx, my - hy) < 12) {
        dragHandleIdx = i;
        dragStartPos = { x: mx, y: my, val: xlfo.steps[i].value, glide: xlfo.steps[i].glide };
        try { xCanvas.setPointerCapture(ev.pointerId); } catch (_) {}
        break;
      }
    }
    if (dragHandleIdx === -1) {
      const idx = clamp(Math.floor(mx / Math.max(1, stepW)), 0, n - 1);
      dragHandleIdx = idx;
      dragStartPos = { x: mx, y: my, val: xlfo.steps[idx].value, glide: xlfo.steps[idx].glide };
      try { xCanvas.setPointerCapture(ev.pointerId); } catch (_) {}
    }
    drawXlfoCurve();
  });

  xCanvas.addEventListener('pointermove', ev => {
    if (dragHandleIdx === -1 || !dragStartPos) return;
    const r = xCanvas.getBoundingClientRect();
    const mx = clamp(ev.clientX - r.left, 0, xW);
    const my = clamp(ev.clientY - r.top, X_PAD_TOP, xH - X_AXIS);
    const xlfo = xlfosState[currentXlfoIdx];
    if (!xlfo) return;
    const n = xlfo.numSteps || 16;
    const stepIdx = clamp(dragHandleIdx, 0, n - 1);
    const step = xlfo.steps[stepIdx];
    let newVal = 1.0 - (my - X_PAD_TOP) / xPlotH();
    if (!ev.shiftKey) newVal = Math.round(newVal * 8) / 8;
    step.value = clamp(newVal, 0.0, 1.0);
    const stepW = xW / n;
    const localX = clamp(mx - stepIdx * stepW, 0, stepW);
    let newGlide = (localX / stepW) * 100;
    if (!ev.shiftKey) newGlide = Math.round(newGlide / 25) * 25;
    step.glide = clamp(newGlide, 0.0, 100.0);
    saveStep(currentXlfoIdx, stepIdx);
    drawXlfoCurve();
  });

  const endXDrag = ev => {
    if (dragHandleIdx !== -1) {
      try { xCanvas.releasePointerCapture(ev.pointerId); } catch (e) {}
      dragHandleIdx = -1;
      dragStartPos = null;
      drawXlfoCurve();
    }
  };
  xCanvas.addEventListener('pointerup', endXDrag);
  xCanvas.addEventListener('pointercancel', endXDrag);

  function applyXlfoPreset(presetName) {
    const xlfo = xlfosState[currentXlfoIdx];
    if (!xlfo || !window.WDKit || !WDKit.buildXlfoPresetSteps) return;
    const numSteps = xlfo.numSteps || 16;
    const built = WDKit.buildXlfoPresetSteps(presetName, numSteps);
    const steps = Array.isArray(built) ? built : (built && built.steps ? built.steps : []);
    for (let i = 0; i < 32 && i < steps.length; ++i) {
      xlfo.steps[i] = {
        index: i,
        value: clamp(steps[i].value, 0, 1),
        glide: clamp(steps[i].glide, 0, 100),
        slope: clamp(steps[i].slope, -1, 1),
      };
    }
    saveXlfoConfig(currentXlfoIdx);
    for (let i = 0; i < numSteps; ++i) saveStep(currentXlfoIdx, i);
    drawXlfoCurve();
  }

  function applyXlfoTransform(op) {
    const xlfo = xlfosState[currentXlfoIdx];
    if (!xlfo || !window.WDKit || !WDKit.transformXlfoSteps) return;
    const numSteps = xlfo.numSteps || 16;
    const arg = op === 'shift' ? 1 : (op === 'smooth' ? 35 : undefined);
    const next = WDKit.transformXlfoSteps(xlfo.steps, op, arg, numSteps);
    for (let i = 0; i < 32 && i < next.length; ++i) {
      xlfo.steps[i] = {
        index: i,
        value: clamp(next[i].value, 0, 1),
        glide: clamp(next[i].glide, 0, 100),
        slope: clamp(next[i].slope, -1, 1),
      };
    }
    for (let i = 0; i < numSteps; ++i) saveStep(currentXlfoIdx, i);
    drawXlfoCurve();
  }

  {
    const bar = $('xlfoPresetBar');
    if (bar) {
      bar.querySelectorAll('[data-xlfo-preset]').forEach(btn => {
        btn.addEventListener('click', () => {
          bar.querySelectorAll('[data-xlfo-preset]').forEach(b => b.classList.toggle('on', b === btn));
          applyXlfoPreset(btn.dataset.xlfoPreset);
        });
      });
      bar.querySelectorAll('[data-xlfo-op]').forEach(btn => {
        btn.addEventListener('click', () => applyXlfoTransform(btn.dataset.xlfoOp));
      });
    }
  }

  const matrixToggle = $('matrixToggle');
  const matrixContainer = $('matrixContainer');
  matrixToggle.addEventListener('click', () => {
    const open = matrixContainer.style.display === 'flex';
    matrixContainer.style.display = open ? 'none' : 'flex';
    matrixToggle.classList.toggle('on', !open);
    matrixToggle.textContent = open ? 'Routes' : 'Hide routes';
  });

  const labelOf = (list, val) => {
    const hit = list.find(o => o.val === val);
    return hit ? hit.label : '—';
  };

  function refreshRouteChips() {
    const chips = $('routeChips');
    const live = activeSlots.filter(s => s.on && s.source >= 0 && s.dest >= 0);
    $('routeCount').textContent = live.length === 0 ? 'no routes live'
      : (live.length + (live.length === 1 ? ' route live' : ' routes live'));
    chips.innerHTML = '';
    live.slice(0, 1).forEach(s => {
      const isExtEnv = (s.source === 4 && followerExtSc);
      const el = document.createElement('div');
      el.className = isExtEnv ? 'route ext-key' : 'route';
      const dot = document.createElement('span');
      dot.className = 'dot';
      el.appendChild(dot);
      el.appendChild(document.createTextNode(
        (isExtEnv ? 'Env (Ext)' : labelOf(SRC_OPTIONS, s.source))
        + ' \u2192 ' + labelOf(DEST_OPTIONS, s.dest)
        + ' ' + Math.round(Math.abs(s.depth) * 50) + '%'));
      chips.appendChild(el);
    });
    if (live.length > 1) {
      const more = document.createElement('button');
      more.className = 'pill sm';
      more.textContent = '+' + (live.length - 1);
      more.addEventListener('click', () => matrixToggle.click());
      chips.appendChild(more);
    }
    updateModCollars();
  }

  async function saveSlot(s) {
    const slot = activeSlots[s];
    if (host) {
      try {
        await host.call('setSlotConfig', s, slot.source, slot.dest, slot.curve, slot.on);
      } catch (e) { console.error('Error saving slot config:', e); }
    }
  }

  function rebuildSlotsGridUI() {
    matrixContainer.innerHTML = '';
    for (let s = 0; s < 24; ++s) {
      const initSlot = activeSlots[s];
      const row = document.createElement('div');
      row.className = 'slot' + (initSlot.on ? ' active' : '');
      row.dataset.slotIndex = s;

      const chk = document.createElement('input');
      chk.type = 'checkbox';
      chk.checked = initSlot.on;
      chk.addEventListener('change', () => {
        const slot = activeSlots[s];
        if (!slot) return;
        slot.on = chk.checked;
        row.classList.toggle('active', slot.on);
        saveSlot(s);
        refreshRouteChips();
        if (patchCords) patchCords.refresh();
      });
      row.appendChild(chk);

      const srcSel = document.createElement('select');
      SRC_OPTIONS.forEach(opt => {
        const o = document.createElement('option');
        o.value = opt.val; o.textContent = opt.label;
        if (initSlot.source === opt.val) o.selected = true;
        srcSel.appendChild(o);
      });
      srcSel.addEventListener('change', () => {
        const slot = activeSlots[s];
        if (!slot) return;
        slot.source = parseInt(srcSel.value, 10);
        saveSlot(s);
        refreshRouteChips();
        if (patchCords) patchCords.refresh();
      });
      row.appendChild(srcSel);

      const arr = document.createElement('span');
      arr.className = 'arrow';
      arr.textContent = '→';
      row.appendChild(arr);

      const destSel = document.createElement('select');
      DEST_OPTIONS.forEach(opt => {
        const o = document.createElement('option');
        o.value = opt.val; o.textContent = opt.label;
        if (initSlot.dest === opt.val) o.selected = true;
        destSel.appendChild(o);
      });
      destSel.addEventListener('change', () => {
        const slot = activeSlots[s];
        if (!slot) return;
        slot.dest = parseInt(destSel.value, 10);
        saveSlot(s);
        refreshRouteChips();
        if (patchCords) patchCords.refresh();
      });
      row.appendChild(destSel);

      const depthSlider = document.createElement('input');
      depthSlider.type = 'range';
      depthSlider.min = -2.0; depthSlider.max = 2.0; depthSlider.step = 0.01;
      depthSlider.value = initSlot.depth;

      const valSpan = document.createElement('span');
      valSpan.className = 'val';
      valSpan.textContent = initSlot.depth.toFixed(2);

      let matrixDragOpen = false;
      const updateMatrixDepth = isFinal => {
        const slot = activeSlots[s];
        if (!slot) return;
        const dVal = clamp(parseFloat(depthSlider.value) || 0, -2.0, 2.0);
        slot.depth = dVal;
        valSpan.textContent = dVal.toFixed(2);
        const pSl = sl('slot' + (s + 1) + 'depth');
        if (pSl) {
          if (!matrixDragOpen) {
            matrixDragOpen = true;
            pSl.sliderDragStarted();
          }
          pSl.setNormalisedValue((dVal + 2.0) / 4.0);
          if (isFinal) {
            matrixDragOpen = false;
            pSl.sliderDragEnded();
          }
        }
        refreshRouteChips();
      };
      depthSlider.addEventListener('pointerdown', ev => {
        if ((ev.button ?? 0) !== 0) return;
        updateMatrixDepth(false);
      });
      depthSlider.addEventListener('input', () => updateMatrixDepth(false));
      depthSlider.addEventListener('pointerup', () => { if (matrixDragOpen) updateMatrixDepth(true); });
      depthSlider.addEventListener('pointercancel', () => { if (matrixDragOpen) updateMatrixDepth(true); });
      depthSlider.addEventListener('change', () => updateMatrixDepth(true));
      row.appendChild(depthSlider);
      row.appendChild(valSpan);

      matrixContainer.appendChild(row);
    }
    refreshRouteChips();
  }

  function applySlotsToRows() {
    for (let s = 0; s < 24; ++s) {
      const slot = activeSlots[s];
      const row = matrixContainer.querySelector('[data-slot-index="' + s + '"]');
      if (!row) continue;
      row.classList.toggle('active', slot.on);
      row.querySelector('input[type="checkbox"]').checked = slot.on;
      const sels = row.querySelectorAll('select');
      sels[0].value = String(slot.source);
      sels[1].value = String(slot.dest);
      row.querySelector('input[type="range"]').value = slot.depth;
      row.querySelector('span.val').textContent = slot.depth.toFixed(2);
    }
    refreshRouteChips();
    if (patchCords) patchCords.refresh();
  }

  function handleRingChangeDepth(slotIndex, depth, isFinal) {
    const slot = activeSlots[slotIndex];
    if (!slot) return;
    const clamped = clamp(depth, -2.0, 2.0);
    slot.depth = clamped;
    const pSl = sl('slot' + (slotIndex + 1) + 'depth');
    if (pSl) {
      if (!ringGestureOpen[slotIndex]) {
        ringGestureOpen[slotIndex] = true;
        pSl.sliderDragStarted();
      }
      pSl.setNormalisedValue((clamped + 2.0) / 4.0);
      if (isFinal) {
        ringGestureOpen[slotIndex] = false;
        pSl.sliderDragEnded();
      }
    }
    const r = matrixContainer.querySelector('[data-slot-index="' + slotIndex + '"]');
    if (r) {
      const rng = r.querySelector('input[type="range"]');
      const valEl = r.querySelector('span.val');
      if (rng) rng.value = clamped;
      if (valEl) valEl.textContent = clamped.toFixed(2);
    }
    refreshRouteChips();
  }

  // ------------------------------------------------------------- formats
  const fmtDb = v => (v > 0 ? '+' : '') + v.toFixed(1) + ' dB';
  const fmtMs = v => v < 10.0 ? v.toFixed(1) + ' ms' : Math.round(v) + ' ms';
  const fmtPct = v => Math.round(v) + '%';
  const fmtHz = v => v < 1000 ? Math.round(v) + ' Hz' : (v / 1000).toFixed(1) + ' kHz';
  const fmtPan = v => Math.abs(v) < 0.5 ? 'C' : (v < 0 ? 'L' + Math.abs(Math.round(v)) : 'R' + Math.round(v));
  const fmtXlfoRate = v => v.toFixed(2) + ' Hz';
  const fmtPhase = v => Math.round(v) + '°';

  const redrawTaps = () => { drawTime(); refreshTitle(); };

  // ------------------------------------------------------------------- init
  function initAll() {
    document.querySelectorAll('.knob').forEach(el => {
      if (window.WDKit && WDKit.mountKnob) WDKit.mountKnob(el);
    });

    const bind = (el, id, fmt, onValueChange = null, unit = undefined) => {
      if (window.WDKit && WDKit.bindSliderKnob) {
        WDKit.bindSliderKnob(el, sl(id), { paramId: id, fmt, unit, onValueChange });
      }
    };

    for (const k of ['a', 'b']) {
      const p = 'tap' + k + '_';
      bind($('param_' + p + 'time'), p + 'time', fmtMs, () => { redrawTaps(); updateModCollars(); }, 'ms');
      bind($('param_' + p + 'level'), p + 'level', fmtPct, redrawTaps);
      bind($('param_' + p + 'pan'), p + 'pan', fmtPan, refreshTitle);
      bindDivisionPills($('div-notes-' + k), $('div-feels-' + k), p + 'syncdiv');
      bindChoiceToggle($('param_' + p + 'sync'), p + 'sync', redrawTaps);
      bindChoiceToggle($('param_' + p + 'invert'), p + 'invert', redrawTaps);
    }

    bind($('param_feedback'), 'feedback', fmtPct, () => { redrawTaps(); updateModCollars(); });
    bind($('param_cross'), 'cross', fmtPct);
    bind($('param_drive'), 'drive', fmtDb, drawLoop);
    bindChoicePills($('routing-group'), 'routing', ROUTING, idx => {
      $('loopHint').textContent = ROUTING[idx] || 'Normal';
    });
    bindChoicePills($('tapemode-group'), 'tapemode', TAPEMODE);
    bindChoiceToggle($('param_freeze'), 'freeze', v => {
      $('timeHint').textContent = v ? 'Frozen' : 'Drag a tap';
    });

    bind($('param_hp'), 'hp', fmtHz, () => { drawLoop(); updateModCollars(); }, 'Hz');
    bind($('param_lp'), 'lp', fmtHz, () => { drawLoop(); updateModCollars(); }, 'Hz');
    bind($('param_diffusion'), 'diffusion', fmtPct);

    bind($('param_duckthresh'), 'duckthresh', fmtDb);
    bind($('param_duckdepth'), 'duckdepth', fmtDb);
    bind($('param_duckrelease'), 'duckrelease', fmtMs, null, 'ms');
    bindChoicePills($('ducksource-group'), 'ducksource', ['Int', 'Ext'], () => {
      updateBeaconLed();
      refreshTitle();
      drawTime();
    });

    bind($('param_mix'), 'mix', fmtPct, updateModCollars);
    bind($('param_inputtrim'), 'inputtrim', fmtDb);
    bind($('param_outputtrim'), 'outputtrim', fmtDb);

    bindToggle($('param_delta'), 'delta');
    bindChoiceToggle($('param_power'), 'power', v => {
      const b = $('param_power');
      if (b) b.lastChild.textContent = v ? 'Engaged' : 'Bypassed';
    });

    for (let i = 1; i <= 3; ++i) {
      bind($('param_xlfo' + i + 'rate'), 'xlfo' + i + 'rate', fmtXlfoRate, null, 'Hz');
      bind($('param_xlfo' + i + 'phase'), 'xlfo' + i + 'phase', fmtPhase);
      bind($('param_xlfo' + i + 'snap'), 'xlfo' + i + 'snap', fmtPct);
      bindToggle($('param_xlfo' + i + 'balance'), 'xlfo' + i + 'balance');
    }

    rebuildSlotsGridUI();

    if (window.WDKit && WDKit.initPatchCords && !patchCords) {
      const tapRectFor = k => {
        const r = timeCanvas.getBoundingClientRect();
        const { taps } = readTaps();
        const p = tapPillBounds(k, taps[k], r.width);
        const left = r.left + Math.min(p.x - 24, p.bx);
        const right = r.left + Math.max(p.x + 24, p.bx + p.tw);
        return { left, top: r.top + 2, right, bottom: r.bottom - 4, width: Math.max(48, right - left), height: Math.max(20, r.height - 6) };
      };
      patchCords = WDKit.initPatchCords({
        sourceSelector: '#sourceBar .wd-src-pill[data-source-id]',
        destSelector: '.knob[data-dest-id]',
        canvasTargets: [
          {
            canvas: timeCanvas,
            destId: 1,
            hitTest(cx, cy) {
              const r = timeCanvas.getBoundingClientRect();
              if (cy < r.top || cy > r.bottom) return false;
              return tapNear(cx - r.left) === 'a';
            },
            getRect: () => tapRectFor('a'),
          },
          {
            canvas: timeCanvas,
            destId: 2,
            hitTest(cx, cy) {
              const r = timeCanvas.getBoundingClientRect();
              if (cy < r.top || cy > r.bottom) return false;
              return tapNear(cx - r.left) === 'b';
            },
            getRect: () => tapRectFor('b'),
          },
        ],
        getSourceColor: id => (SRC_META[id] && SRC_META[id].color) || '#38bdf8',
        getSourceLabel: id => (id === 4 && followerExtSc) ? 'Env (Ext)' : ((SRC_META[id] && SRC_META[id].label) || ('Src ' + id)),
        getDestLabel: did => labelOf(DEST_OPTIONS, did),
        getSlotsForDest: did => activeSlots
          .filter(s => s.dest === did && s.source >= 0)
          .map(s => ({ index: s.index, source: s.source, dest: s.dest, depth: s.depth, on: s.on })),
        onConnect(sourceId, destId) {
          let idx = activeSlots.findIndex(s => s.on && s.source === sourceId && s.dest === destId);
          if (idx === -1) idx = activeSlots.findIndex(s => !s.on || s.dest === -1);
          if (idx === -1) {
            $('routeCount').textContent = 'all 24 slots in use';
            return;
          }
          const slot = activeSlots[idx];
          const wasConnected = slot.on && slot.source === sourceId && slot.dest === destId;
          slot.source = sourceId;
          slot.dest = destId;
          slot.on = true;
          if (!wasConnected && Math.abs(slot.depth) < 0.05) {
            slot.depth = 0.5;
            const pSl = sl('slot' + (idx + 1) + 'depth');
            if (pSl) {
              pSl.sliderDragStarted();
              pSl.setNormalisedValue((slot.depth + 2.0) / 4.0);
              pSl.sliderDragEnded();
            }
          }
          saveSlot(idx);
          applySlotsToRows();
        },
        onChangeDepth: handleRingChangeDepth,
        onToggleSlot(slotIndex, nextOn) {
          const slot = activeSlots[slotIndex];
          if (!slot) return;
          slot.on = !!nextOn;
          saveSlot(slotIndex);
          applySlotsToRows();
        },
        onRemoveSlot(slotIndex) {
          const slot = activeSlots[slotIndex];
          if (!slot) return;
          slot.source = -1;
          slot.dest = -1;
          slot.on = false;
          slot.depth = 0.0;
          const pSl = sl('slot' + (slotIndex + 1) + 'depth');
          if (pSl) {
            pSl.sliderDragStarted();
            pSl.setNormalisedValue(0.5);
            pSl.sliderDragEnded();
          }
          saveSlot(slotIndex);
          applySlotsToRows();
        },
      });
    }

    const q = new URLSearchParams(location.search);
    selectPane(PANES.includes(q.get('pane')) ? q.get('pane') : 'tapa');
    if (q.has('depths')) matrixToggle.click();
    refreshRouteChips();
  }

  function applyModCollar(knobEl, paramId, destId, totalOffsetScaled) {
    const s = sl(paramId);
    if (!knobEl || !s || !window.WDKit || !WDKit.scaledDeltaToNorm || !WDKit.setKnobModulationSources) return;
    const baseScaled = s.getScaledValue();
    const baseNorm = s.getNormalisedValue();
    const routedSlots = activeSlots.filter(slSlot => slSlot.on && slSlot.dest === destId && slSlot.source >= 0);
    knobEl.classList.toggle('is-modulated', routedSlots.length > 0);
    const totalNorm = WDKit.scaledDeltaToNorm(s, baseScaled, totalOffsetScaled || 0);
    if (Math.abs(totalNorm) < 0.001) {
      WDKit.setKnobModulationSources(knobEl, baseNorm, []);
      return;
    }
    if (routedSlots.length === 0) {
      WDKit.setKnobModulationSources(knobEl, baseNorm, [{ sourceId: -1, color: '#38bdf8', offsetNorm: totalNorm }]);
      return;
    }
    if (routedSlots.length === 1) {
      const slot = routedSlots[0];
      WDKit.setKnobModulationSources(knobEl, baseNorm, [{
        sourceId: slot.source,
        color: (SRC_META[slot.source] && SRC_META[slot.source].color) || '#38bdf8',
        offsetNorm: totalNorm,
      }]);
      return;
    }
    let weights = routedSlots.map(slot => Math.abs((liveSlotVals[slot.index] || 0) * (slot.depth || 0)));
    let sumW = weights.reduce((a, b) => a + b, 0);
    if (sumW < 1e-6) {
      weights = routedSlots.map(slot => Math.max(0.01, Math.abs(slot.depth || 0)));
      sumW = weights.reduce((a, b) => a + b, 0);
    }
    const sources = routedSlots.map((slot, i) => ({
      sourceId: slot.source,
      color: (SRC_META[slot.source] && SRC_META[slot.source].color) || '#38bdf8',
      offsetNorm: totalNorm * (weights[i] / sumW),
    }));
    WDKit.setKnobModulationSources(knobEl, baseNorm, sources);
  }

  function updateModCollars() {
    applyModCollar($('param_tapa_time'), 'tapa_time', 1, liveDestOffsets[1] || 0);
    applyModCollar($('param_tapb_time'), 'tapb_time', 2, liveDestOffsets[2] || 0);
    applyModCollar($('param_feedback'), 'feedback', 3, liveDestOffsets[3] || 0);
    applyModCollar($('param_hp'), 'hp', 4, liveDestOffsets[4] || 0);
    applyModCollar($('param_lp'), 'lp', 5, liveDestOffsets[5] || 0);
    applyModCollar($('param_mix'), 'mix', 6, liveDestOffsets[6] || 0);
  }

  const beaconEpochWatch = (window.WDKit && WDKit.createBeaconEpochWatcher)
    ? WDKit.createBeaconEpochWatcher(refreshBeaconSources)
    : null;

  if (window.WDKit && WDKit.mountHeaderKit) {
    WDKit.mountHeaderKit({ host });
  }
  if (window.WDKit && WDKit.syncGlobalTheme) {
    WDKit.syncGlobalTheme(host, t => {
      applyTheme(t);
      drawXlfoCurve();
    });
  }

  // --------------------------------------------------- track name + WD Beacon
  function renderSelfTrackChip() {
    const chip = $('selfTrackChip');
    const nameEl = $('selfTrackName');
    if (nameEl && nameEl.isConnected && !nameEl.querySelector('input'))
      nameEl.textContent = selfMeta.name || 'Delay 1';
    if (chip) {
      const pubName = selfMeta.publishedName || selfMeta.name || 'Delay 1';
      chip.title = 'Click to rename this Delay track · Broadcasting on Beacon as "' + pubName + '"';
    }
  }

  function startInlineTrackRename(labelEl, currentText) {
    if (!labelEl || labelEl.querySelector('input')) return;
    const prev = currentText;
    const input = document.createElement('input');
    input.type = 'text';
    input.maxLength = 47;
    input.className = 'track-name-input';
    input.value = prev;
    let done = false;
    const commit = async keep => {
      if (done) return;
      done = true;
      const next = keep ? input.value.trim() : prev;
      input.replaceWith(labelEl);
      if (keep && host) {
        try {
          const res = await host.call('setInstanceName', next);
          if (res && res.ok) {
            selfMeta.name = res.name || selfMeta.name;
            selfMeta.customName = res.customName || '';
            if (typeof res.beaconPublishedName === 'string') selfMeta.publishedName = res.beaconPublishedName;
            if (typeof res.beaconPublishing === 'boolean') selfMeta.publishing = res.beaconPublishing;
            renderSelfTrackChip();
          }
        } catch (e) {}
      }
    };
    input.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') { ev.preventDefault(); commit(true); }
      else if (ev.key === 'Escape') { ev.preventDefault(); commit(false); }
      ev.stopPropagation();
    });
    input.addEventListener('pointerdown', ev => ev.stopPropagation());
    input.addEventListener('blur', () => commit(true));
    labelEl.replaceWith(input);
    input.focus({ preventScroll: true });
    input.select();
  }

  {
    const chip = $('selfTrackChip');
    if (chip) {
      chip.addEventListener('click', () => startInlineTrackRename($('selfTrackName'), selfMeta.customName || selfMeta.name));
    }
  }

  function isExternalKeyActive() {
    return comboIndex('ducksource', 2) === 1 || !!followerExtSc;
  }

  function renderFollowerExtBtn() {
    const btn = $('btn_followerExtSc');
    if (!btn) return;
    btn.classList.toggle('on', !!followerExtSc);
    btn.textContent = followerExtSc ? 'Env Key: Ext' : 'Env Key: Int';
  }

  {
    const extBtn = $('btn_followerExtSc');
    if (extBtn) {
      extBtn.addEventListener('click', async () => {
        followerExtSc = !followerExtSc;
        renderFollowerExtBtn();
        updateBeaconLed();
        if (host) {
          try { await host.call('setFollowerExtSc', followerExtSc); } catch (e) {}
        }
      });
    }
  }

  function updateBeaconLed() {
    const wrap = $('beaconPickerWrap');
    if (!wrap) return;
    const extOn = isExternalKeyActive();
    wrap.classList.remove('receiving', 'waiting', 'mismatch');
    if (!extOn) {
      wrap.title = beaconSelected
        ? `Internal key active — switch Duck Key or Env Key to Ext to receive WD Beacon "${beaconSelected}".`
        : 'Select an active Werewolf Digital Beacon track for external ducking or Envelope Follower keying. Wireless cross-track key — for sample-exact timing at large DAW buffer sizes (1024+), use Off (Host Bus) with a DAW sidechain send.';
      return;
    }
    if (beaconSelected) {
      if (beaconSrMismatch) {
        wrap.classList.add('mismatch');
        wrap.title = `Sample rate mismatch between this track and WD Beacon "${beaconSelected}" — external key input is muted.`;
      } else if (beaconReceiving) {
        wrap.classList.add('receiving');
        wrap.title = `Receiving external key audio from WD Beacon "${beaconSelected}". Wireless cross-track key — for sample-exact timing at large DAW buffer sizes (1024+), use Off (Host Bus) with a DAW sidechain send.`;
      } else {
        wrap.classList.add('waiting');
        wrap.title = `Waiting for WD Beacon "${beaconSelected}" stream (active on Host Bus 1 only if Bus 1 is enabled). Wireless cross-track key — for sample-exact timing at large DAW buffer sizes (1024+), use Off (Host Bus) with a DAW sidechain send.`;
      }
    } else if (scActive) {
      wrap.classList.add('receiving');
      wrap.title = 'Receiving external sidechain audio from Host Sidechain Bus 1.';
    } else {
      wrap.classList.add('waiting');
      wrap.title = 'External key set to Host Sidechain Bus 1 — waiting for incoming sidechain audio. For sample-exact timing at large DAW buffer sizes (1024+), keep Off (Host Bus) with a DAW sidechain send.';
    }
  }

  function renderBeaconSources(res) {
    const sel = $('beaconSourceSelect');
    if (!sel || !res || typeof res !== 'object') return;
    const sources = Array.isArray(res.sources) ? res.sources : [];
    if (typeof res.selected === 'string') beaconSelected = res.selected;
    if (!beaconMetersSeen) {
      if (typeof res.receiving === 'boolean') beaconReceiving = res.receiving;
      if (typeof res.scActive === 'boolean') scActive = res.scActive;
    }
    if (typeof res.srMismatch === 'boolean') beaconSrMismatch = res.srMismatch;

    const sig = sources.map(s => `${s.name}:${s.sr}:${s.ch}`).join('|') + '#' + beaconSelected;
    updateBeaconLed();
    if (document.activeElement === sel || sig === lastBeaconSig) return;
    lastBeaconSig = sig;

    sel.textContent = '';
    const off = document.createElement('option');
    off.value = '';
    off.textContent = 'Off (Host Bus)';
    sel.appendChild(off);

    let found = (beaconSelected === '');
    for (const s of sources) {
      if (!s || typeof s.name !== 'string') continue;
      const opt = document.createElement('option');
      opt.value = s.name;
      const sr = s.sr ? (s.sr / 1000).toFixed(s.sr % 1000 === 0 ? 0 : 1) + 'k' : '?';
      const ch = s.ch === 1 ? 'Mono' : s.ch === 2 ? 'St' : (s.ch + 'ch');
      opt.textContent = `${s.name} (${sr} · ${ch})`;
      if (s.name === beaconSelected) found = true;
      sel.appendChild(opt);
    }
    if (!found && beaconSelected) {
      const offline = document.createElement('option');
      offline.value = beaconSelected;
      offline.textContent = `${beaconSelected} (waiting…)`;
      sel.appendChild(offline);
    }
    sel.value = beaconSelected;
  }

  async function refreshBeaconSources() {
    if (!host) return;
    try {
      const res = await host.call('getBeaconSources');
      renderBeaconSources(res);
    } catch (e) {}
  }

  {
    const sel = $('beaconSourceSelect');
    if (sel) {
      sel.addEventListener('pointerdown', refreshBeaconSources);
      sel.addEventListener('focus', refreshBeaconSources);
      sel.addEventListener('change', async () => {
        beaconSelected = sel.value || '';
        beaconSrMismatch = false;
        if (beaconSelected && comboIndex('ducksource', 2) !== 1) {
          setComboIndex('ducksource', 1);
        }
        updateBeaconLed();
        refreshTitle();
        drawTime();
        if (host) {
          try {
            const res = await host.call('setBeaconSource', beaconSelected);
            if (res && typeof res.receiving === 'boolean') beaconReceiving = res.receiving;
            if (res && typeof res.scActive === 'boolean') scActive = res.scActive;
            if (res && typeof res.srMismatch === 'boolean') beaconSrMismatch = res.srMismatch;
            updateBeaconLed();
            drawTime();
          } catch (e) {}
        }
      });
    }
  }

  // ------------------------------------------------------------- meters
  let mIn = -120, mOut = -120, mDuck = 0;

  function updateMeters(meters) {
    const inMax = Math.max(meters.inL ?? -120, meters.inR ?? -120);
    const outMax = Math.max(meters.outL ?? -120, meters.outR ?? -120);
    const duckDb = Math.abs(meters.ducking || 0);

    beaconMetersSeen = true;
    if (beaconEpochWatch) beaconEpochWatch(meters);
    if (typeof meters.beaconReceiving === 'boolean') beaconReceiving = meters.beaconReceiving;
    if (typeof meters.scActive === 'boolean') scActive = meters.scActive;
    if (typeof meters.beaconSrMismatch === 'boolean') beaconSrMismatch = meters.beaconSrMismatch;
    if (typeof meters.beaconSource === 'string' && !beaconSelected) beaconSelected = meters.beaconSource;
    if (typeof meters.sc === 'number' && isFinite(meters.sc)) {
      liveScDb = meters.sc;
      scTrace.push(liveScDb);
      if (scTrace.length > 64) scTrace.shift();
    }
    if (typeof meters.selfName === 'string' && meters.selfName) {
      selfMeta.name = meters.selfName;
      if (typeof meters.selfCustomName === 'string') selfMeta.customName = meters.selfCustomName;
      if (typeof meters.beaconPublishedName === 'string') selfMeta.publishedName = meters.beaconPublishedName;
      if (typeof meters.beaconPublishing === 'boolean') selfMeta.publishing = meters.beaconPublishing;
      renderSelfTrackChip();
    }
    updateBeaconLed();

    mIn += (inMax - mIn) * (inMax > mIn ? 0.8 : 0.15);
    mOut += (outMax - mOut) * (outMax > mOut ? 0.8 : 0.15);
    mDuck += (duckDb - mDuck) * (duckDb > mDuck ? 0.85 : 0.1);
    liveInDb = mIn; liveOutDb = mOut; liveDuckDb = mDuck;

    const dbToPct = db => clamp((db + 80) / 80, 0, 1) * 100;
    const inBar = $('inBar'), outBar = $('outBar');
    if (inBar) inBar.style.width = dbToPct(mIn).toFixed(1) + '%';
    if (outBar) outBar.style.setProperty('--fill', dbToPct(mOut).toFixed(1) + '%');
    $('inVal').textContent = mIn <= -119.5 ? '—' : mIn.toFixed(1) + ' dB';
    $('outVal').textContent = mOut <= -119.5 ? '—' : mOut.toFixed(1) + ' dB';
    $('duckVal').textContent = mDuck < 0.05 ? '—' : '−' + mDuck.toFixed(1) + ' dB';

    drawTime();
  }

  setTimeout(async () => {
    initAll();
    renderFollowerExtBtn();
    fitTimeCanvas();
    fitLoopCanvas();
    fitXCanvas();
    uiReady = true;

    for (let s = 0; s < 24; ++s) {
      const slider = sl('slot' + (s + 1) + 'depth');
      if (slider) {
        activeSlots[s].depth = slider.getNormalisedValue() * 4.0 - 2.0;
        slider.valueChangedEvent.addListener(() => {
          activeSlots[s].depth = slider.getNormalisedValue() * 4.0 - 2.0;
          const r = matrixContainer.querySelector('[data-slot-index="' + s + '"]');
          if (r) {
            r.querySelector('input[type="range"]').value = activeSlots[s].depth;
            r.querySelector('span.val').textContent = activeSlots[s].depth.toFixed(2);
          }
          refreshRouteChips();
        });
      }
    }

    if (host) {
      try {
        const modState = await Promise.race([
          host.call('getModState'),
          new Promise(res => setTimeout(() => res(null), 400))
        ]);
        if (modState) {
          if (Array.isArray(modState.slots)) {
            modState.slots.forEach(s => {
              if (s.index >= 0 && s.index < 24) {
                Object.assign(activeSlots[s.index], {
                  index: s.index, source: s.source, dest: s.dest,
                  curve: s.curve, on: s.on
                });
              }
            });
          }
          if (Array.isArray(modState.xlfos)) {
            modState.xlfos.forEach(x => {
              if (x.index >= 0 && x.index < 3) {
                const xlfo = xlfosState[x.index];
                xlfo.numSteps = x.numSteps;
                xlfo.isSynced = x.isSynced;
                xlfo.syncRateBeats = x.syncRateBeats;
                xlfo.retriggerMode = x.retriggerMode;
                if (Array.isArray(x.steps)) {
                  x.steps.forEach(st => {
                    if (st.index >= 0 && st.index < 32)
                      xlfo.steps[st.index] = { index: st.index, value: st.value, glide: st.glide, slope: st.slope };
                  });
                }
              }
            });
          }
          if (typeof modState.followerExtSc === 'boolean') {
            followerExtSc = modState.followerExtSc;
            renderFollowerExtBtn();
            updateBeaconLed();
          }
        }
      } catch (e) {}

      applySlotsToRows();
      drawXlfoCurve();

      try {
        const uiState = await host.call('getUiState');
        if (uiState) {
          if (uiState.build) $('buildTag').textContent = uiState.build;
          if (uiState.sampleRate) $('srTag').textContent = (uiState.sampleRate / 1000).toFixed(1) + ' kHz';
          if (typeof uiState.bpm === 'number' && window.WDKit && WDKit.setHostBpm) WDKit.setHostBpm(uiState.bpm);
          if (window.WDKit && WDKit.bindBrandDiagnostics) {
            WDKit.bindBrandDiagnostics(document.querySelector('.brand'), {
              plugin: 'Werewolf Digital Delay',
              sampleRate: uiState.sampleRate ? (uiState.sampleRate / 1000).toFixed(1) + ' kHz' : '—',
              build: uiState.build || '—'
            });
          }
          if (uiState.selfName) selfMeta.name = uiState.selfName;
          if (typeof uiState.selfCustomName === 'string') selfMeta.customName = uiState.selfCustomName;
          if (typeof uiState.beaconPublishedName === 'string') selfMeta.publishedName = uiState.beaconPublishedName;
          if (typeof uiState.beaconPublishing === 'boolean') selfMeta.publishing = uiState.beaconPublishing;
          if (typeof uiState.beaconSource === 'string') beaconSelected = uiState.beaconSource;
          if (typeof uiState.beaconReceiving === 'boolean') beaconReceiving = uiState.beaconReceiving;
          if (typeof uiState.scActive === 'boolean') scActive = uiState.scActive;
          if (typeof uiState.beaconSrMismatch === 'boolean') beaconSrMismatch = uiState.beaconSrMismatch;
          renderSelfTrackChip();
          updateBeaconLed();
        }
      } catch (e) {}
      await refreshBeaconSources();
    } else {
      applySlotsToRows();
      drawXlfoCurve();
      renderSelfTrackChip();
      updateBeaconLed();
    }
  }, 120);

  if (host) {
    host.on('meters', data => { if (data) updateMeters(data); });
    host.on('modState', data => {
      if (!data) return;
      liveSourceVals = Array.isArray(data.sourceVals) ? data.sourceVals : liveSourceVals;
      liveXlfoPhases = Array.isArray(data.xlfoPhases) ? data.xlfoPhases : liveXlfoPhases;
      liveSlotVals = Array.isArray(data.slotVals) ? data.slotVals : liveSlotVals;
      if (data.destOffsets !== undefined) {
        liveDestOffsets = Array.isArray(data.destOffsets) ? data.destOffsets : [];
        updateModCollars();
        drawTime();
        drawLoop();
      }
      drawXlfoCurve();
      if (typeof data.followerExtSc === 'boolean' && data.followerExtSc !== followerExtSc) {
        followerExtSc = data.followerExtSc;
        renderFollowerExtBtn();
        updateBeaconLed();
      }
    });
  } else {
    setInterval(() => {
      const t = Date.now() * 0.001;
      const sig = -30 + 20 * Math.sin(t * 1.5) + 5 * Math.sin(t * 8);
      const duck = sig > -35 ? -12 * Math.max(0, (sig + 35) / 25) : 0;
      updateMeters({ inL: sig, inR: sig, outL: sig + duck - 3, outR: sig + duck - 3, ducking: duck });
    }, 33);
  }

})();
</script>
</body>
</html>
