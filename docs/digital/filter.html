  function paintOutputMeter() {
    shownOutDb = Math.max(liveOutDb, shownOutDb - 1.5);
    const pct = clamp(((shownOutDb + 60) / 60) * 100, 0, 100);
    const bar = $('outMeterBar');
    const val = $('outMeterVal');
    if (bar) bar.style.setProperty('--fill', pct.toFixed(1) + '%');
    if (val) val.textContent = shownOutDb <= -59.5 ? '—' : shownOutDb.toFixed(1) + ' dB';
  }

  // ------------------------------------------------------------------- init
  function initAll() {
    document.querySelectorAll('.knob').forEach(el => {
      if (window.WDKit && WDKit.mountKnob) WDKit.mountKnob(el);
    });

    bindSlider($('param_mix'), 'mix', v => Math.round(v) + '%', () => updateModCollars());
    bindChoiceBed($('routing-group'), 'routing', ROUTING_CHOICES.length, () => {
      updateRoutingText();
      drawResponse();
    });

    bindToggle($('param_delta'), 'delta');
    bindToggle($('param_power'), 'power', v => {
      const b = $('param_power');
      if (b) b.lastChild.textContent = v ? 'Engaged' : 'Bypassed';
    });

    for (let i = 1; i <= 3; ++i) {
      sl('xlfo' + i + 'rate');
      sl('xlfo' + i + 'phase');
      sl('xlfo' + i + 'snap');
      tg('xlfo' + i + 'balance');
    }
    bindActiveXlfoControls();
    bindBlock('A');
    bindBlock('B');
    if (window.WDKit && WDKit.enhanceAllKnobs) WDKit.enhanceAllKnobs(sl);
    selectBlock('A');
    syncXlfoMetaSelectors();
  }

  const DEST_KNOB_MAP = [
    { destId: 1,  knobId: 'param_freqA',  paramId: 'freqA',  kind: 'freq'  },
    { destId: 2,  knobId: 'param_resoA',  paramId: 'resoA',  kind: 'reso'  },
    { destId: 3,  knobId: 'param_driveA', paramId: 'driveA', kind: 'drive' },
    { destId: 4,  knobId: 'param_panA',   paramId: 'panA',   kind: 'pan'   },
    { destId: 5,  knobId: 'param_levelA', paramId: 'levelA', kind: 'level' },
    { destId: 6,  knobId: 'param_freqB',  paramId: 'freqB',  kind: 'freq'  },
    { destId: 7,  knobId: 'param_resoB',  paramId: 'resoB',  kind: 'reso'  },
    { destId: 8,  knobId: 'param_driveB', paramId: 'driveB', kind: 'drive' },
    { destId: 9,  knobId: 'param_panB',   paramId: 'panB',   kind: 'pan'   },
    { destId: 10, knobId: 'param_levelB', paramId: 'levelB', kind: 'level' },
    { destId: 11, knobId: 'param_mix',    paramId: 'mix',    kind: 'mix'   }
  ];

  function updateModCollars() {
    if (!window.WDKit || !WDKit.setKnobModulationSources || !WDKit.scaledDeltaToNorm) return;

    const deltaFor = (kind, base, off) => {
      if (kind === 'freq')  return clamp(base * Math.pow(2.0, off), 20, 20000) - base;
      if (kind === 'reso')  return clamp(base + off, 0, 100) - base;
      if (kind === 'drive') return clamp(base + off, 0, 24) - base;
      if (kind === 'pan')   return clamp(base + off, -100, 100) - base;
      if (kind === 'level') return clamp(base + off, -24, 12) - base;
      return clamp(base + off, 0, 100) - base;
    };

    for (const d of DEST_KNOB_MAP) {
      const el = $(d.knobId);
      const s = sl(d.paramId);
      if (!el || !s) continue;

      const routedSlots = activeSlots.filter(slot => slot.on && slot.dest === d.destId && slot.source >= 0);
      el.classList.toggle('is-modulated', routedSlots.length > 0);

      const baseScaled = s.getScaledValue();
      const baseNorm = s.getNormalisedValue();
      const totalOffset = liveDestOffsets[d.destId] || 0;

      if (routedSlots.length === 0 || Math.abs(totalOffset) < 1e-6) {
        WDKit.setKnobModulationSources(el, baseNorm, []);
        continue;
      }

      const totalDeltaScaled = deltaFor(d.kind, baseScaled, totalOffset);
      const totalNorm = WDKit.scaledDeltaToNorm(s, baseScaled, totalDeltaScaled);

      if (routedSlots.length === 1) {
        const slot = routedSlots[0];
        WDKit.setKnobModulationSources(el, baseNorm, [{
          sourceId: slot.source,
          color: getSourceColor(slot.source),
          offsetNorm: totalNorm,
          label: getSourceLabel(slot.source)
        }]);
      } else {
        let weights = routedSlots.map(slot => Math.abs((liveSlotVals[slot.index] || 0) * (slot.depth || 0)));
        let sumW = weights.reduce((acc, w) => acc + w, 0);
        if (sumW < 1e-6) {
          weights = routedSlots.map(slot => Math.max(0.01, Math.abs(slot.depth || 0)));
          sumW = weights.reduce((acc, w) => acc + w, 0);
        }
        const sources = routedSlots.map((slot, i) => ({
          sourceId: slot.source,
          color: getSourceColor(slot.source),
          offsetNorm: totalNorm * (weights[i] / sumW),
          label: getSourceLabel(slot.source)
        }));
        WDKit.setKnobModulationSources(el, baseNorm, sources);
      }
    }
  }

  // ------------------------------------------- Patch Cords & Hover Depth Ring
  const ringGestureOpen = new Array(24).fill(false);

  function nearestResponseHandleAt(cx, cy) {
    if (!responseCanvas) return null;
    const r = responseCanvas.getBoundingClientRect();
    if (r.width <= 0 || r.height <= 0) return null;
    const mx = cx - r.left;
    const my = cy - r.top;
    if (my < 0 || my > r.height) return null;
    const A = readBlock('A'), B = readBlock('B');
    const xA = clamp((Math.log(A.freq / FMIN) / Math.log(FMAX / FMIN)) * r.width, 0, r.width);
    const xB = clamp((Math.log(B.freq / FMIN) / Math.log(FMAX / FMIN)) * r.width, 0, r.width);
    const dA = Math.abs(mx - xA);
    const dB = Math.abs(mx - xB);
    if (dA > 24 && dB > 24) return null;
    if (dA <= 24 && dB <= 24) {
      if (Math.abs(dA - dB) < 6) return currentBlock;
      return dA <= dB ? 'A' : 'B';
    }
    return dA <= 24 ? 'A' : 'B';
  }

  function handleRectFor(block) {
    const r = responseCanvas.getBoundingClientRect();
    const blk = readBlock(block);
    const hx = clamp((Math.log(blk.freq / FMIN) / Math.log(FMAX / FMIN)) * r.width, 0, r.width);
    return {
      left: r.left + hx - 28,
      top: r.top + 6,
      right: r.left + hx + 28,
      bottom: r.top + 30,
      width: 56,
      height: 24
    };
  }

  const patchCords = (window.WDKit && WDKit.initPatchCords)
    ? WDKit.initPatchCords({
        sourceSelector: '[data-source-id]',
        destSelector: '.knob[data-dest-id]',
        canvasTargets: responseCanvas ? [
          {
            canvas: responseCanvas,
            destId: 1,
            hitTest: (cx, cy) => nearestResponseHandleAt(cx, cy) === 'A',
            getRect: () => handleRectFor('A')
          },
          {
            canvas: responseCanvas,
            destId: 6,
            hitTest: (cx, cy) => nearestResponseHandleAt(cx, cy) === 'B',
            getRect: () => handleRectFor('B')
          }
        ] : [],
        getSourceColor,
        getSourceLabel,
        getDestLabel: id => labelOf(DEST_OPTIONS, id),
        getSlotsForDest: destId => activeSlots.filter(s => s.dest === destId && s.source >= 0),
        onConnect: (sourceId, destId) => {
          let slot = activeSlots.find(s => s.source === sourceId && s.dest === destId);
          if (!slot) {
            slot = activeSlots.find(s => !s.on && (s.dest < 0 || s.source < 0))
                || activeSlots.find(s => !s.on);
          }
          if (!slot) return;
          slot.source = sourceId;
          slot.dest = destId;
          slot.on = true;
          const dSlider = sl('slot' + (slot.index + 1) + 'depth');
          if (Math.abs(slot.depth) < 0.05) {
            slot.depth = 1.0;
            if (dSlider) {
              dSlider.sliderDragStarted();
              dSlider.setNormalisedValue((1.0 + 2.0) / 4.0);
              dSlider.sliderDragEnded();
            }
          }
          saveSlot(slot.index);
          rebuildSlotsGridUI();
          updateModCollars();
        },
        onChangeDepth: (slotIndex, depth, isFinal) => {
          const slot = activeSlots[slotIndex];
          if (!slot) return;
          const d = clamp(Number.isFinite(depth) ? depth : 0, -2.0, 2.0);
          slot.depth = d;
          const dSlider = sl('slot' + (slotIndex + 1) + 'depth');
          if (dSlider) {
            if (!ringGestureOpen[slotIndex]) {
              ringGestureOpen[slotIndex] = true;
              dSlider.sliderDragStarted();
            }
            dSlider.setNormalisedValue((d + 2.0) / 4.0);
            if (isFinal && ringGestureOpen[slotIndex]) {
              ringGestureOpen[slotIndex] = false;
              dSlider.sliderDragEnded();
            }
          }
          if (matrixContainer) {
            const r = matrixContainer.querySelector('[data-slot-index="' + slotIndex + '"]');
            if (r) {
              const rng = r.querySelector('input[type="range"]');
              const lbl = r.querySelector('span.val');
              if (rng) rng.value = d;
              if (lbl) lbl.textContent = d.toFixed(2);
            }
          }
          refreshRouteChips();
          updateModCollars();
        },
        onToggleSlot: (slotIndex, nextOn) => {
          const slot = activeSlots[slotIndex];
          if (!slot) return;
          slot.on = !!nextOn;
          saveSlot(slotIndex);
          rebuildSlotsGridUI();
          updateModCollars();
        },
        onRemoveSlot: slotIndex => {
          const slot = activeSlots[slotIndex];
          if (!slot) return;
          slot.on = false;
          slot.source = -1;
          slot.dest = -1;
          slot.depth = 0.0;
          const dSlider = sl('slot' + (slotIndex + 1) + 'depth');
          if (dSlider) {
            if (ringGestureOpen[slotIndex]) {
              ringGestureOpen[slotIndex] = false;
              dSlider.sliderDragEnded();
            }
            dSlider.sliderDragStarted();
            dSlider.setNormalisedValue(0.5);
            dSlider.sliderDragEnded();
          }
          saveSlot(slotIndex);
          rebuildSlotsGridUI();
          updateModCollars();
        }
      })
    : null;

  // ------------------------------------------------ Binary Telemetry Poller
  const telemetryPoller = (window.WDKit && WDKit.createTelemetryPoller)
    ? WDKit.createTelemetryPoller(pkt => {
        if (!pkt || pkt.kind !== 9 || !pkt.floats) return;
        const fl = pkt.floats;
        if (fl.length >= FFT_BINS) {
          for (let i = 0; i < FFT_BINS; ++i) {
            const v = fl[i];
            preFft[i] = Number.isFinite(v) ? v : -120;
          }
          preFftValid = true;
        }
        if (fl.length >= FFT_BINS * 2) {
          for (let i = 0; i < FFT_BINS; ++i) {
            const v = fl[FFT_BINS + i];
            postFft[i] = Number.isFinite(v) ? v : -120;
          }
          postFftValid = true;
        }
        drawResponse();
      }, 16)
    : null;
  if (telemetryPoller) telemetryPoller.start();

  const beaconEpochWatch = (window.WDKit && WDKit.createBeaconEpochWatcher)
    ? WDKit.createBeaconEpochWatcher(refreshBeaconSources)
    : null;

  if (window.WDKit && WDKit.mountHeaderKit) {
    WDKit.mountHeaderKit({ host });
  }
  if (window.WDKit && WDKit.syncGlobalTheme) {
    WDKit.syncGlobalTheme(host, t => applyTheme(t));
  }

  setTimeout(async () => {
    initAll();
    renderFollowerExtBtn();

    if (host) {
      try {
        const state = await Promise.race([
          host.call('getModState'),
          new Promise(res => setTimeout(() => res(null), 400))
        ]);
        if (state && typeof state === 'object') {
          if (Array.isArray(state.slots)) {
            state.slots.forEach(s => {
              if (s && s.index >= 0 && s.index < 24) {
                activeSlots[s.index] = {
                  index: s.index, source: s.source, dest: s.dest,
                  curve: s.curve, on: !!s.on, depth: 0.0
                };
              }
            });
          }
          if (Array.isArray(state.xlfos)) {
            state.xlfos.forEach(x => {
              if (!x || x.index < 0 || x.index >= 3) return;
              const target = xlfosState[x.index];
              target.numSteps = clamp(x.numSteps || 4, 1, 32);
              target.isSynced = x.isSynced !== undefined ? !!x.isSynced : true;
              target.syncRateBeats = Number.isFinite(x.syncRateBeats) ? x.syncRateBeats : 1.0;
              target.retriggerMode = clamp(x.retriggerMode ?? 1, 0, 3);
              if (Array.isArray(x.steps)) {
                x.steps.forEach(st => {
                  if (!st || st.index < 0 || st.index >= 32) return;
                  target.steps[st.index] = {
                    index: st.index,
                    value: clamp(Number.isFinite(st.value) ? st.value : 0, 0, 1),
                    glide: clamp(Number.isFinite(st.glide) ? st.glide : 100, 0, 100),
                    slope: clamp(Number.isFinite(st.slope) ? st.slope : 0, -1, 1)
                  };
                });
              }
            });
          }
          if (typeof state.followerExtSc === 'boolean') {
            followerExtSc = state.followerExtSc;
            renderFollowerExtBtn();
            updateBeaconLed();
          }
        }
      } catch (e) { console.error('Error getting initial modState:', e); }
    }

    for (let s = 0; s < 24; ++s) {
      const slider = sl('slot' + (s + 1) + 'depth');
      if (slider) {
        activeSlots[s].depth = slider.getNormalisedValue() * 4.0 - 2.0;
        slider.valueChangedEvent.addListener(() => {
          activeSlots[s].depth = slider.getNormalisedValue() * 4.0 - 2.0;
          if (matrixContainer) {
            const r = matrixContainer.querySelector('[data-slot-index="' + s + '"]');
            if (r) {
              r.querySelector('input[type="range"]').value = activeSlots[s].depth;
              r.querySelector('span.val').textContent = activeSlots[s].depth.toFixed(2);
            }
          }
          refreshRouteChips();
          updateModCollars();
        });
      }
    }

    rebuildSlotsGridUI();
    syncXlfoMetaSelectors();
    updateModCollars();
    if (patchCords) patchCords.refresh();
    fitResponseCanvas();
    fitCharCanvas();
    fitXlfoCanvas();
    uiReady = true;

    if (host) {
      try {
        const uiState = await host.call('getUiState');
        if (uiState) {
          if (uiState.build) $('buildTag').textContent = uiState.build;
          if (uiState.sampleRate) {
            sampleRate = uiState.sampleRate;
            $('srTag').textContent = (uiState.sampleRate / 1000).toFixed(1) + ' kHz';
            drawResponse();
          }
          if (window.WDKit && WDKit.bindBrandDiagnostics) {
            WDKit.bindBrandDiagnostics(document.querySelector('.brand'), {
              plugin: 'Werewolf Digital Filter',
              sampleRate: uiState.sampleRate ? (uiState.sampleRate / 1000).toFixed(1) + ' kHz' : '—',
              build: uiState.build || '—'
            });
          }
          if (uiState.selfName) selfMeta.name = uiState.selfName;
          if (typeof uiState.selfCustomName === 'string') selfMeta.customName = uiState.selfCustomName;
          if (typeof uiState.beaconPublishedName === 'string') selfMeta.publishedName = uiState.beaconPublishedName;
          if (typeof uiState.beaconPublishing === 'boolean') selfMeta.publishing = uiState.beaconPublishing;
          if (typeof uiState.beaconSource === 'string') beaconSelected = uiState.beaconSource;
          if (typeof uiState.beaconReceiving === 'boolean') beaconReceiving = uiState.beaconReceiving;
          if (typeof uiState.scActive === 'boolean') scActive = uiState.scActive;
          if (typeof uiState.beaconSrMismatch === 'boolean') beaconSrMismatch = uiState.beaconSrMismatch;
          renderSelfTrackChip();
          updateBeaconLed();
          drawResponse();
        }
      } catch (e) {}
      await refreshBeaconSources();
    } else {
      renderSelfTrackChip();
      updateBeaconLed();
    }
  }, 120);

  // ------------------------------------------------------------ live events
  if (host) {
    host.on('modState', data => {
      if (!data) return;
      liveSourceVals = data.sourceVals || liveSourceVals;
      liveXlfoPhases = data.xlfoPhases || liveXlfoPhases;
      liveSlotVals = data.slotVals || liveSlotVals;
      liveDestOffsets = data.destOffsets || liveDestOffsets;
      if (typeof data.followerExtSc === 'boolean' && data.followerExtSc !== followerExtSc) {
        followerExtSc = data.followerExtSc;
        renderFollowerExtBtn();
        updateBeaconLed();
        refreshRouteChips();
      }
      updateModCollars();
      drawResponse();
      drawCharacter();
      drawXlfoCurve();
    });

    host.on('meters', data => {
      if (!data) return;
      beaconMetersSeen = true;
      if (beaconEpochWatch) beaconEpochWatch(data);
      if (typeof data.inDb === 'number') liveInDb = data.inDb;
      if (typeof data.outDb === 'number') liveOutDb = data.outDb;
      if (typeof data.beaconReceiving === 'boolean') beaconReceiving = data.beaconReceiving;
      if (typeof data.scActive === 'boolean') scActive = data.scActive;
      if (typeof data.beaconSrMismatch === 'boolean') beaconSrMismatch = data.beaconSrMismatch;
      if (typeof data.beaconSource === 'string' && !beaconSelected) beaconSelected = data.beaconSource;
      if (typeof data.sc === 'number' && isFinite(data.sc)) {
        liveScDb = data.sc;
        scTrace.push(liveScDb);
        if (scTrace.length > 64) scTrace.shift();
      }
      if (typeof data.selfName === 'string' && data.selfName) {
        selfMeta.name = data.selfName;
        if (typeof data.selfCustomName === 'string') selfMeta.customName = data.selfCustomName;
        if (typeof data.beaconPublishedName === 'string') selfMeta.publishedName = data.beaconPublishedName;
        if (typeof data.beaconPublishing === 'boolean') selfMeta.publishing = data.beaconPublishing;
        renderSelfTrackChip();
      }
      updateBeaconLed();
      paintOutputMeter();
      if (followerExtSc) drawResponse();
      drawCharacter();
    });
  } else {
    setInterval(() => {
      const t = Date.now() * 0.001;
      liveInDb = -18 + 12 * Math.sin(t * 3);
      liveOutDb = liveInDb - 3;
      paintOutputMeter();
      drawCharacter();
    }, 33);
  }

})();
</script>
</body>
</html>
